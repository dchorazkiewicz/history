image: null
summary: "Rosyjska matematyczka, jedna z pierwszych kobiet w Europie, które uzyskały doktorat z matematyki i profesurę uniwersytecką. Wniosła ważny wkład do równań różniczkowych i mechaniki bryły sztywnej, a równolegle pisała prozę i wspomnienia."
summary_original: "Russian mathematician, one of the first women in Europe to earn a doctorate in mathematics and hold a university professorship. She made major contributions to differential equations and rigid-body mechanics while also writing fiction and memoir."
