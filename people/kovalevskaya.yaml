    year: 1889
    precision: year
    type: mathematical_treatise
ideas:
  - name: "Twierdzenie Cauchy’ego-Kowalewskiej"
    original_name: "Cauchy–Kovalevskaya theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Cauchy%E2%80%93Kovalevskaya_theorem"
    summary: "Twierdzenie podaje warunki lokalnego istnienia i jednoznaczności analitycznych rozwiązań ważnej klasy równań różniczkowych cząstkowych."
    summary_original: "The theorem gives local existence and uniqueness conditions for analytic solutions of an important class of partial differential equations."
  - name: "Przypadek Kowalewskiej w ruchu bryły sztywnej"
    original_name: "Kovalevskaya top"
    summary: "Odkryła nowy całkowalny przypadek ruchu ciężkiej bryły sztywnej wokół stałego punktu."
    summary_original: "She discovered a new integrable case of the motion of a heavy rigid body around a fixed point."
