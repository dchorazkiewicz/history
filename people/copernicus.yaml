image: null
summary: "Renesansowy uczony, który rozwinął heliocentryczny model planetarny i przedstawił go systematycznie w dziele O obrotach sfer niebieskich."
summary_original: "Renaissance polymath who developed the heliocentric planetary model presented systematically in De revolutionibus."
works:
  - title: "Mały komentarz"
    original_title: "Commentariolus"
    year: 1514
    precision: approximate
    dating_note: "Nieopublikowany rękopis krążył przed O obrotach sfer niebieskich; zwykle datuje się go na okres przed 1514 r."
    dating_note_original: "Unpublished manuscript circulated before De revolutionibus; commonly dated before 1514."
    type: manuscript
  - title: "Sposób bicia monety"
    original_title: "Monetae cudendae ratio"
    year: 1526
    precision: year
    type: economic_treatise
  - title: "O obrotach sfer niebieskich"
    original_title: "De revolutionibus orbium coelestium"
