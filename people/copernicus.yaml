    year: 1543
    precision: year
    type: book
ideas:
  - name: "Heliocentryzm kopernikański"
    original_name: "Copernican heliocentrism"
    wikipedia: "https://pl.wikipedia.org/wiki/Heliocentryzm"
    summary: "Ziemia obraca się wokół własnej osi i wraz z innymi planetami krąży wokół Słońca; model ten gruntownie przeorganizował astronomię planetarną."
    summary_original: "Earth rotates daily and, with the other planets, revolves around the Sun; the model reorganized planetary astronomy."
  - name: "Analiza pieniądza i psucia monety"
    original_name: "Quantity theory / monetary analysis"
    summary: "Kopernik pisał również o biciu monet, skutkach obniżania ich wartości oraz o wartości pieniądza."
    summary_original: "Copernicus also wrote on coinage, monetary debasement and the value of money."
events:
  - year: 1491
    title: "Studia w Krakowie"
    original_title: "Studies at Kraków"
    summary: "Rozpoczął studia na Uniwersytecie Krakowskim, gdzie zetknął się m.in. z matematyką i astronomią."
    summary_original: "Began studies at the University of Kraków, where mathematics and astronomy formed part of his education."
  - year: 1543
    title: "Publikacja O obrotach sfer niebieskich"
    original_title: "Publication of De revolutionibus"
    summary: "Pierwsze wydanie ukazało się w Norymberdze w roku śmierci Kopernika."
    summary_original: "The first edition was printed in Nuremberg in the year of Copernicus's death."
