image: null
summary: "Rosyjski matematyk o niezwykle szerokim dorobku. Zaksjomatyzował teorię prawdopodobieństwa, wniósł fundamentalny wkład do teorii turbulencji i układów dynamicznych, współtworzył teorię złożoności algorytmicznej oraz silnie wpływał na edukację matematyczną."
summary_original: "Russian mathematician of exceptionally broad scope. He axiomatized probability theory, made fundamental contributions to turbulence and dynamical systems, helped create algorithmic complexity theory and strongly influenced mathematical education."
