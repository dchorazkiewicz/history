ideas:
  - name: "Aksjomaty Kołmogorowa"
    original_name: "Kolmogorov axioms"
    wikipedia: "https://en.wikipedia.org/wiki/Probability_axioms"
    summary: "Kołmogorow oparł rachunek prawdopodobieństwa na teorii miary i trzech prostych aksjomatach."
    summary_original: "Kolmogorov grounded probability in measure theory using three simple axioms."
  - name: "Teoria turbulencji K41"
    original_name: "Kolmogorov 1941 turbulence theory"
    summary: "Zaproponował skalującą teorię kaskady energii w turbulencji, fundamentalną dla mechaniki płynów."
    summary_original: "He proposed a scaling theory of the energy cascade in turbulence, fundamental to fluid mechanics."
  - name: "Teoria KAM"
    original_name: "KAM theory"
    summary: "Jego twierdzenie o stabilności quasiokresowych orbit zostało rozwinięte przez Arnolda i Mosera w teorię KAM."
    summary_original: "His theorem on the stability of quasiperiodic motion was extended by Arnold and Moser into KAM theory."
  - name: "Złożoność Kołmogorowa"
    original_name: "Kolmogorov complexity"
    wikipedia: "https://en.wikipedia.org/wiki/Kolmogorov_complexity"
    summary: "Ilość informacji w obiekcie można mierzyć długością najkrótszego programu, który go generuje."
    summary_original: "The information content of an object can be measured by the length of the shortest program that generates it."
