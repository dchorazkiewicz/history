image: null
summary: "Niemiecki matematyk nazywany często ojcem nowoczesnej analizy. Dążył do rygorystycznego oparcia rachunku na granicach i nierównościach, rozwijał teorię funkcji rzeczywistych i zespolonych oraz wychował całe pokolenie wybitnych matematyków."
summary_original: "German mathematician often called a father of modern analysis. He sought rigorous foundations for calculus in limits and inequalities, advanced real and complex function theory, and trained an entire generation of leading mathematicians."
