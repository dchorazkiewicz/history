    year: 1856
    precision: year
    type: mathematical_treatise
ideas:
  - name: "Rygoryzm epsilon-delta"
    original_name: "Epsilon-delta rigor"
    summary: "Weierstrass systematycznie formułował granice i ciągłość za pomocą precyzyjnych nierówności, eliminując odwołania do niejasnych wielkości nieskończenie małych."
    summary_original: "Weierstrass systematically formulated limits and continuity using precise inequalities, avoiding vague appeals to infinitesimals."
  - name: "Funkcja ciągła nigdzie nieróżniczkowalna"
    original_name: "Nowhere differentiable continuous function"
    wikipedia: "https://en.wikipedia.org/wiki/Weierstrass_function"
    summary: "Skonstruował przykład funkcji ciągłej w każdym punkcie, ale nieróżniczkowalnej w żadnym, podważając geometryczne intuicje XIX wieku."
    summary_original: "He constructed an example continuous everywhere but differentiable nowhere, challenging nineteenth-century geometric intuition."
  - name: "Twierdzenie o rozkładzie funkcji całkowitych na iloczyn"
    original_name: "Weierstrass factorization theorem"
    summary: "Pokazał, że funkcje całkowite można budować jako odpowiednio zbieżne iloczyny określone przez ich zera."
    summary_original: "He showed that entire functions can be represented by suitably convergent products determined by their zeros."
events:
  - year: 1854
    precision: year
    title: "Przełomowa publikacja o funkcjach abelowych"
    original_title: "Breakthrough publication on Abelian functions"
    summary: "Praca zwróciła uwagę berlińskich matematyków na nauczyciela gimnazjalnego z prowincji i odmieniła jego karierę."
    summary_original: "The paper drew Berlin mathematicians' attention to a provincial schoolteacher and transformed his career."
  - year: 1856
    precision: year
    title: "Przeniesienie do Berlina"
    original_title: "Move to Berlin"
    summary: "Weierstrass rozpoczął działalność akademicką w Berlinie, gdzie jego wykłady stały się legendarnym centrum nowoczesnej analizy."
    summary_original: "Weierstrass began his academic career in Berlin, where his lectures became a legendary center of modern analysis."
