    year: 1925
    precision: year
    type: scientific_treatise
  - title: "O treści intuicyjnej kinematyki i mechaniki kwantowoteoretycznej"
    original_title: "Über den anschaulichen Inhalt der quantentheoretischen Kinematik und Mechanik"
    year: 1927
    precision: year
    type: scientific_treatise
ideas:
  - name: "Mechanika macierzowa"
    original_name: "Matrix mechanics"
    wikipedia: "https://en.wikipedia.org/wiki/Matrix_mechanics"
    summary: "Heisenberg zbudował teorię opartą na obserwowalnych wielkościach i regułach mnożenia odpowiadających nieprzemiennym macierzom."
    summary_original: "Heisenberg built a theory based on observable quantities and multiplication rules corresponding to noncommuting matrices."
  - name: "Zasada nieoznaczoności"
    original_name: "Heisenberg uncertainty principle"
    wikipedia: "https://en.wikipedia.org/wiki/Uncertainty_principle"
    summary: "Niektórych par wielkości, takich jak położenie i pęd, nie można jednocześnie określić z dowolną dokładnością."
    summary_original: "Certain pairs of quantities, such as position and momentum, cannot simultaneously be specified with arbitrary precision."
