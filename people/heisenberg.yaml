image: null
summary: "Niemiecki fizyk teoretyczny, jeden z głównych twórców mechaniki kwantowej. W 1925 r. stworzył pierwszą kompletną wersję mechaniki kwantowej w postaci macierzowej, a następnie sformułował zasadę nieoznaczoności."
summary_original: "German theoretical physicist and one of the principal creators of quantum mechanics. In 1925 he developed the first complete formulation of quantum mechanics in matrix form and later formulated the uncertainty principle."
works:
  - title: "O kwantowoteoretycznej interpretacji relacji kinematycznych i mechanicznych"
