    summary: "Praca Heisenberga została rozwinięta matematycznie przez Borna i Jordana."
    summary_original: "Heisenberg's paper was mathematically developed by Born and Jordan."
  - year: 1932
    precision: year
    title: "Nagroda Nobla w dziedzinie fizyki"
