    title: "Założenie American Journal of Mathematics"
    original_title: "Founding the American Journal of Mathematics"
    summary: "Czasopismo stało się jednym z najważniejszych kanałów rozwoju profesjonalnej matematyki w Stanach Zjednoczonych."
    summary_original: "The journal became one of the major channels for the development of professional mathematics in the United States."
