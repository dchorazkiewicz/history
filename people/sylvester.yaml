ideas:
  - name: "Termin „macierz”"
    original_name: "The term matrix"
    summary: "Sylvester wprowadził termin „matrix” dla prostokątnego układu liczb, z którego można wydobywać minory i wyznaczniki."
    summary_original: "Sylvester introduced the term 'matrix' for a rectangular array from which minors and determinants could be formed."
  - name: "Teoria niezmienników"
    original_name: "Invariant theory"
    summary: "Wspólnie z Cayleyem rozwijał badanie wielomianów zachowujących określone własności przy przekształceniach zmiennych."
    summary_original: "Together with Cayley he developed the study of polynomials preserving specified properties under changes of variables."
  - name: "Prawo bezwładności Sylvestera"
    original_name: "Sylvester's law of inertia"
    wikipedia: "https://en.wikipedia.org/wiki/Sylvester%27s_law_of_inertia"
    summary: "Dla formy kwadratowej liczby dodatnich i ujemnych składników diagonalnych pozostają niezmienne przy odwracalnej zmianie współrzędnych."
    summary_original: "For a quadratic form, the numbers of positive and negative diagonal terms remain invariant under invertible coordinate changes."
events:
