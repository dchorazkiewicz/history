image: null
summary: "Brytyjski matematyk, bliski współpracownik Cayleya. Rozwijał teorię niezmienników, macierze, teorię liczb i geometrię, wprowadził wiele terminów algebraicznych, a jako profesor Johns Hopkins założył American Journal of Mathematics."
summary_original: "British mathematician and close collaborator of Cayley. He advanced invariant theory, matrices, number theory and geometry, introduced many algebraic terms, and as a professor at Johns Hopkins founded the American Journal of Mathematics."
