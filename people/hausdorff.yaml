ideas:
  - name: "Przestrzenie Hausdorffa"
    original_name: "Hausdorff spaces"
    wikipedia: "https://en.wikipedia.org/wiki/Hausdorff_space"
    summary: "Hausdorff wyodrębnił warunek rozdzielania punktów przez rozłączne otoczenia, dziś podstawowy aksjomat topologiczny."
    summary_original: "Hausdorff isolated the condition that distinct points have disjoint neighborhoods, now a basic topological separation axiom."
  - name: "Wymiar Hausdorffa"
    original_name: "Hausdorff dimension"
    wikipedia: "https://en.wikipedia.org/wiki/Hausdorff_dimension"
    summary: "Uogólnił pojęcie wymiaru tak, by można było mierzyć także zbiory o wymiarze niecałkowitym."
    summary_original: "He generalized dimension so that sets of non-integer dimension could also be measured."
