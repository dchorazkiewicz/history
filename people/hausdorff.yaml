    original_title: "Publication of Grundzüge der Mengenlehre"
    summary: "Książka uporządkowała język nowoczesnej topologii i teorii mnogości."
    summary_original: "The book systematized the language of modern topology and set theory."
  - year: 1942
    precision: year
    title: "Śmierć w obliczu deportacji"
    original_title: "Death in the face of deportation"
    summary: "Po otrzymaniu nakazu przeniesienia do miejsca internowania Hausdorff, jego żona i jej siostra odebrali sobie życie, próbując uniknąć nazistowskich prześladowań."
    summary_original: "After receiving an order to move to an internment site, Hausdorff, his wife and her sister took their own lives in an attempt to avoid Nazi persecution."
