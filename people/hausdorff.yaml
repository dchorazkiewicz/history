summary: "Niemiecki matematyk, jeden z twórców topologii ogólnej i teorii mnogości. Równolegle pod pseudonimem Paul Mongré pisał filozofię i literaturę. Jego Grundzüge der Mengenlehre stały się jednym z pierwszych systematycznych podręczników nowoczesnej teorii zbiorów i topologii."
summary_original: "German mathematician and a founder of general topology and set theory. Under the pseudonym Paul Mongré he also wrote philosophy and literature. His Grundzüge der Mengenlehre became one of the first systematic textbooks of modern set theory and topology."
