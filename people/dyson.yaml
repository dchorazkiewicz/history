    year: 1949
    precision: year
    type: scientific_treatise
ideas:
  - name: "Synteza elektrodynamiki kwantowej"
    original_name: "Synthesis of quantum electrodynamics"
    summary: "Dyson pokazał, że pozornie odmienne formalizmy QED są matematycznie równoważne i uporządkował teorię perturbacji."
    summary_original: "Dyson showed that apparently different QED formalisms are mathematically equivalent and organized perturbation theory."
  - name: "Szereg Dysona"
    original_name: "Dyson series"
    wikipedia: "https://en.wikipedia.org/wiki/Dyson_series"
    summary: "Rozwinięcie operatora ewolucji w szeregu czasowo uporządkowanych całek jest podstawowym narzędziem teorii perturbacji."
    summary_original: "The time-ordered expansion of the evolution operator is a basic tool of perturbation theory."
  - name: "Sfera Dysona"
    original_name: "Dyson sphere"
    summary: "W rozważaniach astrofizycznych opisał hipotetyczne struktury wykorzystujące dużą część energii gwiazdy jako potencjalną sygnaturę zaawansowanej cywilizacji."
    summary_original: "In astrophysical speculation he described structures capturing a large fraction of a star's energy as a possible signature of an advanced civilization."
events:
  - year: 1949
    precision: year
    title: "Synteza różnych postaci QED"
    original_title: "Unification of QED formulations"
    summary: "Prace Dysona pozwoliły fizykom używać najbardziej praktycznych elementów formalizmów Feynmana i operatorowych metod QED."
    summary_original: "Dyson's work allowed physicists to combine practical elements of Feynman's formulation with operator methods."
