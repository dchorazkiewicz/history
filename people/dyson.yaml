image: null
summary: "Brytyjsko-amerykański fizyk matematyczny, który wykazał równoważność sformułowań QED Feynmana, Schwingera i Tomonagi oraz nadał diagramom Feynmana systematyczny status rachunkowy. Pracował też nad materią skondensowaną, astrofizyką i energetyką jądrową."
summary_original: "British-American mathematical physicist who demonstrated the equivalence of Feynman's, Schwinger's and Tomonaga's formulations of QED and systematized Feynman-diagram calculations. He also worked on condensed matter, astrophysics and nuclear technology."
works:
  - title: "Teorie promieniowania Tomonagi, Schwingera i Feynmana"
