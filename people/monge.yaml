image: null
summary: "Francuski matematyk, inżynier, nauczyciel i administrator rewolucyjnej Francji. Stworzył geometrię wykreślną, rozwijał geometrię różniczkową powierzchni i sformułował problem transportowy, od którego wywodzi się współczesna teoria transportu optymalnego."
summary_original: "French mathematician, engineer, teacher and administrator of Revolutionary France. He created descriptive geometry, advanced the differential geometry of surfaces and formulated the transport problem from which modern optimal transport descends."
