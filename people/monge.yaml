ideas:
  - name: "Geometria wykreślna"
    original_name: "Descriptive geometry"
    summary: "Monge stworzył system odwzorowywania obiektów trójwymiarowych na dwie płaszczyzny rzutowe, kluczowy dla inżynierii, architektury i wojskowości."
    summary_original: "Monge created a system for representing three-dimensional objects on two projection planes, crucial to engineering, architecture and military practice."
  - name: "Linie krzywizny powierzchni"
    original_name: "Lines of curvature"
    summary: "Badał kierunki głównej krzywizny na powierzchniach, stając się jednym z pionierów geometrii różniczkowej."
    summary_original: "He studied directions of principal curvature on surfaces, becoming a pioneer of differential geometry."
  - name: "Problem Monge’a"
    original_name: "Monge optimal transport problem"
    wikipedia: "https://en.wikipedia.org/wiki/Transportation_theory_(mathematics)"
    summary: "Zapytał o najbardziej oszczędny sposób przeniesienia masy ziemi z obszaru wykopów do obszaru nasypów, tworząc pierwotną wersję problemu transportu optymalnego."
    summary_original: "He asked for the least costly way to move earth from excavation sites to fill sites, originating the optimal transport problem."
events:
  - year: 1765
    precision: approximate
    title: "Praca w szkole wojskowej w Mézières"
    original_title: "Work at the military school in Mézières"
    summary: "Problemy fortyfikacyjne doprowadziły Monge’a do stworzenia metod geometrii wykreślnej."
    summary_original: "Fortification problems led Monge to create methods of descriptive geometry."
  - year: 1792
    precision: year
    title: "Minister marynarki"
    original_title: "Minister of the Navy"
    summary: "Podczas rewolucji francuskiej Monge pełnił krótko funkcję ministra marynarki."
    summary_original: "During the French Revolution Monge briefly served as Minister of the Navy."
  - year: 1794
    precision: year
    title: "Współtworzenie École Polytechnique"
    original_title: "Co-founding the École Polytechnique"
    summary: "Monge odegrał kluczową rolę w programie i nauczaniu nowej szkoły techniczno-naukowej."
    summary_original: "Monge played a key role in the curriculum and teaching of the new scientific-engineering school."
  - year: 1798
    precision: year
    title: "Wyprawa Napoleona do Egiptu"
    original_title: "Napoleon's expedition to Egypt"
    summary: "Monge należał do głównych uczonych towarzyszących ekspedycji i współtworzył Institut d'Égypte."
    summary_original: "Monge was among the leading scholars accompanying the expedition and helped found the Institut d'Égypte."
