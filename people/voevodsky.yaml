summary: "Rosyjsko-amerykański matematyk, twórca motywicznej teorii homotopii i kluczowych nowych metod w geometrii algebraicznej. Pod koniec życia rozwijał uniwalentne podstawy matematyki i formalną weryfikację dowodów."
summary_original: "Russian-American mathematician and creator of motivic homotopy theory and major new methods in algebraic geometry. Late in life he developed univalent foundations and formal verification of mathematics."
