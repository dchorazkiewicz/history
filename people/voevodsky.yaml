ideas:
  - name: "Motywiczna teoria homotopii"
    original_name: "Motivic homotopy theory"
    summary: "Voevodsky przeniósł idee homotopii topologicznej do geometrii algebraicznej, tworząc nowy język dla motywów i kohomologii."
    summary_original: "Voevodsky transported ideas from topological homotopy into algebraic geometry, creating a new language for motives and cohomology."
  - name: "Dowód hipotezy Milnora"
    original_name: "Proof of the Milnor conjecture"
    summary: "Jego metody motywiczne doprowadziły do dowodu głębokiego związku między K-teorią Milnora i kohomologią Galois."
    summary_original: "His motivic methods led to the proof of a deep relation between Milnor K-theory and Galois cohomology."
  - name: "Uniwalentne podstawy"
    original_name: "Univalent foundations"
    wikipedia: "https://en.wikipedia.org/wiki/Univalent_foundations"
    summary: "Voevodsky proponował budowanie podstaw matematyki na teorii typów nadającej się do formalizacji i komputerowej kontroli dowodów."
    summary_original: "Voevodsky proposed foundations based on type theory suitable for formalization and computer verification of proofs."
