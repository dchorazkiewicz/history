fields: [mathematics, analysis, complex_analysis, differential_equations, algebra, group_theory, probability, mechanics, elasticity, optics, physics, education]
image: null
summary: "Francuski matematyk o ogromnej produktywności, jeden z głównych twórców rygorystycznej analizy XIX wieku. Rozwinął pojęcia granicy, ciągłości i zbieżności, stworzył fundamenty analizy zespolonej, wniósł istotny wkład do teorii grup, równań różniczkowych, sprężystości i optyki."
summary_original: "Extremely prolific French mathematician and one of the principal creators of rigorous nineteenth-century analysis. He developed concepts of limit, continuity and convergence, laid foundations of complex analysis, and made major contributions to group theory, differential equations, elasticity and optics."
works:
  - title: "Kurs analizy"
