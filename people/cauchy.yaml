ideas:
  - name: "Rygor granic, ciągłości i zbieżności"
    original_name: "Rigor in limits, continuity and convergence"
    summary: "Cauchy próbował oprzeć analizę na precyzyjnych definicjach granicy i zbieżności, ograniczając wcześniejsze intuicyjne manipulacje nieskończenie małymi."
    summary_original: "Cauchy sought to base analysis on precise definitions of limits and convergence, reducing earlier intuitive manipulation of infinitesimals."
  - name: "Twierdzenie całkowe Cauchy’ego"
    original_name: "Cauchy integral theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Cauchy%27s_integral_theorem"
    summary: "Podstawowy wynik analizy zespolonej wiążący holomorficzność z własnościami całek po krzywych."
    summary_original: "A fundamental result of complex analysis linking holomorphicity with contour integrals."
  - name: "Ciągi Cauchy’ego"
    original_name: "Cauchy sequences"
    summary: "Warunek Cauchy’ego pozwala rozpoznawać zbieżność przez porównywanie wyrazów ciągu ze sobą, bez znajomości granicy z góry."
    summary_original: "The Cauchy condition detects convergence by comparing sequence terms with one another without knowing the limit in advance."
  - name: "Teoria grup permutacji"
    original_name: "Permutation group theory"
    summary: "Cauchy rozwinął badanie permutacji jako obiektów algebraicznych i udowodnił wyniki, które stały się częścią późniejszej teorii grup."
    summary_original: "Cauchy advanced the study of permutations as algebraic objects and proved results that became part of later group theory."
events:
  - year: 1816
    precision: year
    title: "Wybór do Académie des Sciences"
    original_title: "Election to the Académie des Sciences"
    summary: "Cauchy uzyskał miejsce w Akademii i szybko stał się jedną z dominujących postaci francuskiej matematyki."
    summary_original: "Cauchy gained a place in the Academy and rapidly became a dominant figure in French mathematics."
  - year: 1821
    precision: year
    title: "Publikacja Cours d'analyse"
    original_title: "Publication of Cours d'analyse"
    summary: "Podręcznik stał się symbolem zwrotu ku większemu rygorowi w analizie."
    summary_original: "The textbook became a symbol of the shift toward greater rigor in analysis."
  - year: 1830
    precision: year
    title: "Wyjazd z Francji po rewolucji lipcowej"
    original_title: "Departure from France after the July Revolution"
    summary: "Cauchy odmówił złożenia przysięgi nowemu reżimowi i przez kilka lat pracował poza Francją."
    summary_original: "Cauchy refused the oath to the new regime and worked abroad for several years."
