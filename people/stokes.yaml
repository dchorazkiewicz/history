image: null
summary: "Irlandzki matematyk i fizyk związany z Cambridge. Rozwijał mechanikę płynów, optykę i teorię fal, współtworzył równania Naviera-Stokesa i wprowadził pojęcie fluorescencji."
summary_original: "Irish mathematician and physicist based at Cambridge. He advanced fluid mechanics, optics and wave theory, helped develop the Navier–Stokes equations and introduced the concept of fluorescence."
