ideas:
  - name: "Równania Naviera-Stokesa"
    original_name: "Navier–Stokes equations"
    wikipedia: "https://en.wikipedia.org/wiki/Navier%E2%80%93Stokes_equations"
    summary: "Stokes rozwinął równania ruchu lepkich płynów, które stały się podstawą współczesnej mechaniki płynów."
    summary_original: "Stokes developed equations for viscous fluid motion that became foundational to modern fluid mechanics."
  - name: "Prawo Stokesa"
    original_name: "Stokes' law"
    wikipedia: "https://en.wikipedia.org/wiki/Stokes%27_law"
    summary: "Prawo opisuje opór działający na małą kulę poruszającą się powoli w lepkim płynie."
    summary_original: "The law describes drag on a small sphere moving slowly through a viscous fluid."
  - name: "Fluorescencja"
    original_name: "Fluorescence"
    wikipedia: "https://en.wikipedia.org/wiki/Fluorescence"
    summary: "Stokes badał substancje emitujące światło o większej długości fali niż światło padające i wprowadził nazwę „fluorescencja”."
    summary_original: "Stokes studied substances emitting longer-wavelength light than they absorbed and coined the term 'fluorescence.'"
  - name: "Parametry Stokesa"
    original_name: "Stokes parameters"
    summary: "Wprowadził sposób ilościowego opisu stanu polaryzacji światła."
    summary_original: "He introduced a quantitative description of the polarization state of light."
