summary: "Amerykański fizyk teoretyczny, współtwórca amerykańskiej szkoły fizyki teoretycznej i dyrektor naukowy Los Alamos podczas Projektu Manhattan. Przed wojną pracował m.in. nad mechaniką kwantową, promieniowaniem kosmicznym i teorią kolapsu grawitacyjnego."
summary_original: "American theoretical physicist who helped build the American school of theoretical physics and served as scientific director of Los Alamos during the Manhattan Project. Before the war he worked on quantum mechanics, cosmic rays and gravitational collapse."
