summary: "Brytyjski astrofizyk i astronom, pionier teorii struktury gwiazd i jeden z najważniejszych popularyzatorów ogólnej teorii względności w świecie anglojęzycznym. Kierował obserwacjami zaćmienia Słońca w 1919 r."
summary_original: "British astrophysicist and astronomer, a pioneer of stellar structure theory and one of the most important advocates of general relativity in the English-speaking world. He led eclipse observations in 1919."
