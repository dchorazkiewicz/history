    summary: "Eddington łączył równowagę hydrostatyczną, ciśnienie promieniowania i transport energii, tworząc nowoczesny obraz wnętrza gwiazdy."
    summary_original: "Eddington combined hydrostatic equilibrium, radiation pressure and energy transport into a modern model of stellar interiors."
  - name: "Granica Eddingtona"
