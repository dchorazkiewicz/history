image: null
summary: "Amerykański matematyk, który zmienił badania trójwymiarowych rozmaitości przez wprowadzenie geometrycznego sposobu patrzenia na topologię. Jego program geometrizacji połączył topologię, geometrię hiperboliczną i dynamikę i doprowadził później do rozwiązania hipotezy Poincarégo przez Perelmana."
summary_original: "American mathematician who transformed the study of three-dimensional manifolds by introducing a geometric viewpoint into topology. His geometrization program connected topology, hyperbolic geometry and dynamics and later led to Perelman's proof of the Poincaré conjecture."
works:
  - title: "Geometria i topologia trójwymiarowych rozmaitości"
    original_title: "The Geometry and Topology of Three-Manifolds"
    year: 1979
    precision: approximate
    type: manuscript
    publication_note: "Wpływowe notatki wykładowe z Princeton, krążące przez lata jako nieformalny podstawowy tekst dziedziny."
    publication_note_original: "Influential Princeton lecture notes that circulated for years as an informal foundational text of the field."
ideas:
  - name: "Hipoteza geometrizacji Thurstona"
    original_name: "Thurston geometrization conjecture"
    wikipedia: "https://en.wikipedia.org/wiki/Geometrization_conjecture"
    summary: "Każda zwarta trójrozmaitość może zostać rozłożona na części niosące jedną z ośmiu standardowych geometrii."
    summary_original: "Every compact 3-manifold can be decomposed into pieces carrying one of eight standard geometries."
  - name: "Geometria hiperboliczna trójrozmaitości"
    original_name: "Hyperbolic 3-manifolds"
    summary: "Thurston pokazał, że ogromna część topologii trójwymiarowej jest naturalnie opisywana geometrią hiperboliczną."
    summary_original: "Thurston showed that a vast part of three-dimensional topology is naturally described by hyperbolic geometry."
  - name: "Norma Thurstona"
    original_name: "Thurston norm"
    summary: "Niezmiennik mierzy złożoność powierzchni reprezentujących klasy homologii w trójrozmaitości."
    summary_original: "The invariant measures the complexity of surfaces representing homology classes in a 3-manifold."
events:
