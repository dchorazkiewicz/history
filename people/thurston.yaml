    precision: year
    title: "Profesor w Princeton"
    original_title: "Professor at Princeton"
    summary: "Thurston stworzył wokół siebie dynamiczne środowisko badawcze topologii trójwymiarowej."
    summary_original: "Thurston built a dynamic research environment around three-dimensional topology."
  - year: 1982
