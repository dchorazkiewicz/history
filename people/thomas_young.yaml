image: null
summary: "Brytyjski lekarz i uczony o niezwykle szerokich zainteresowaniach. Jego doświadczenie z dwiema szczelinami dostarczyło mocnego argumentu za falową naturą światła; badał także sprężystość, widzenie barwne, akustykę oraz hieroglify egipskie."
summary_original: "British physician and polymath. His double-slit experiment provided strong evidence for the wave nature of light; he also studied elasticity, color vision, acoustics and Egyptian hieroglyphs."
