    year: 1802
    precision: year
    type: scientific_treatise
ideas:
  - name: "Doświadczenie Younga z dwiema szczelinami"
    original_name: "Young's double-slit experiment"
    wikipedia: "https://en.wikipedia.org/wiki/Double-slit_experiment"
    summary: "Interferencja światła przechodzącego przez dwie szczeliny tworzy układ prążków, który naturalnie wyjaśnia teoria falowa."
    summary_original: "Interference of light passing through two slits produces fringes naturally explained by wave theory."
  - name: "Moduł Younga"
    original_name: "Young's modulus"
    wikipedia: "https://en.wikipedia.org/wiki/Young%27s_modulus"
    summary: "Wielkość opisująca sprężystą sztywność materiału przez stosunek naprężenia do odkształcenia."
    summary_original: "A quantity describing elastic stiffness through the ratio of stress to strain."
  - name: "Trójchromatyczna teoria widzenia"
    original_name: "Trichromatic theory of color vision"
    summary: "Young zaproponował, że widzenie barw opiera się na trzech rodzajach receptorów o różnej czułości widmowej."
    summary_original: "Young proposed that color vision depends on three receptor types with different spectral sensitivities."
  - name: "Wkład w odczytanie hieroglifów"
    original_name: "Contribution to deciphering hieroglyphs"
    summary: "Badając Kamień z Rosetty Young rozpoznał fonetyczny charakter części znaków i identyfikował imiona w kartuszach."
    summary_original: "Studying the Rosetta Stone, Young recognized phonetic elements of the script and identified names in cartouches."
