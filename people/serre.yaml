summary: "Francuski matematyk o wyjątkowym wpływie na geometrię algebraiczną, topologię i teorię liczb. Jego prace nad snopami, kohomologią i relacją między geometrią algebraiczną a analityczną pomogły stworzyć język nowoczesnej matematyki."
summary_original: "French mathematician of exceptional influence on algebraic geometry, topology and number theory. His work on sheaves, cohomology and the relation between algebraic and analytic geometry helped create the language of modern mathematics."
