image: null
summary: "Niemiecki matematyk, który odegrał kluczową rolę w arytmetyzacji analizy i narodzinach nowoczesnej algebry. Wprowadził przekroje Dedekinda jako konstrukcję liczb rzeczywistych, rozwinął teorię ideałów w teorii liczb algebraicznych i tworzył strukturalne ujęcie liczb naturalnych."
summary_original: "German mathematician who played a key role in the arithmetization of analysis and the birth of modern algebra. He introduced Dedekind cuts as a construction of the real numbers, developed ideal theory in algebraic number theory and created a structural account of natural numbers."
