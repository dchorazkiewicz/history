ideas:
  - name: "Przekroje Dedekinda"
    original_name: "Dedekind cuts"
    summary: "Liczby rzeczywiste można zdefiniować przez podziały liczb wymiernych na dwie klasy spełniające odpowiednie warunki porządku."
    summary_original: "Real numbers can be defined through partitions of the rationals into two classes satisfying suitable order conditions."
  - name: "Ideały w pierścieniach liczb algebraicznych"
    original_name: "Ideals in algebraic number theory"
    summary: "Dedekind wprowadził ideały, aby przywrócić jednoznaczność rozkładu na czynniki w rozszerzonych strukturach liczbowych."
    summary_original: "Dedekind introduced ideals to restore unique factorization in extended number systems."
  - name: "Strukturalne ujęcie liczb naturalnych"
    original_name: "Structural conception of natural numbers"
    summary: "Definiował liczby naturalne przez struktury i odwzorowania, antycypując późniejszy aksjomatyczny język teorii mnogości i algebry."
    summary_original: "He defined natural numbers through structures and mappings, anticipating later axiomatic language in set theory and algebra."
events:
  - year: 1858
    precision: year
    title: "Idea przekrojów podczas wykładów w Zurychu"
    original_title: "Idea of Dedekind cuts during lectures in Zurich"
    summary: "Potrzeba ścisłego wyjaśnienia ciągłości prostej doprowadziła Dedekinda do konstrukcji przekrojów."
    summary_original: "The need to explain the continuity of the line rigorously led Dedekind to the cut construction."
  - year: 1863
    precision: year
    title: "Redakcja wykładów Dirichleta z teorii liczb"
    original_title: "Editing Dirichlet's lectures on number theory"
    summary: "Dedekind wielokrotnie rozszerzał pośmiertne wydania wykładów Dirichleta, dodając własne idee, które stały się fundamentem algebraicznej teorii liczb."
    summary_original: "Dedekind repeatedly expanded posthumous editions of Dirichlet's lectures with his own ideas, foundational to algebraic number theory."
