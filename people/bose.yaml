summary: "Indyjski fizyk i matematyk, którego nowy sposób liczenia stanów kwantowych doprowadził do statystyki Bosego-Einsteina. Od jego nazwiska pochodzi termin „bozon”."
summary_original: "Indian physicist and mathematician whose new counting of quantum states led to Bose–Einstein statistics. The term 'boson' derives from his name."
