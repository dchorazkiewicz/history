ideas:
  - name: "Architektura von Neumanna"
    original_name: "Von Neumann architecture"
    wikipedia: "https://en.wikipedia.org/wiki/Von_Neumann_architecture"
    summary: "Program i dane są przechowywane w tej samej pamięci, a procesor wykonuje instrukcje kolejno odczytywane z pamięci."
    summary_original: "Programs and data are stored in the same memory, with the processor executing instructions fetched from memory."
  - name: "Teoria gier"
    original_name: "Game theory"
    summary: "Von Neumann stworzył matematyczną teorię strategii w konfliktach i konkurencji, obejmującą m.in. twierdzenie minimax."
    summary_original: "Von Neumann created a mathematical theory of strategy in conflict and competition, including the minimax theorem."
  - name: "Algebry operatorów"
    original_name: "Operator algebras"
    summary: "Rozwijał teorię operatorów w przestrzeniach Hilberta i struktury dziś nazywane algebrami von Neumanna."
    summary_original: "He developed operator theory on Hilbert spaces and structures now called von Neumann algebras."
  - name: "Matematyczne podstawy mechaniki kwantowej"
    original_name: "Mathematical foundations of quantum mechanics"
    summary: "Ujął mechanikę kwantową w rygorystycznym formalizmie przestrzeni Hilberta i operatorów."
    summary_original: "He formulated quantum mechanics rigorously in terms of Hilbert spaces and operators."
events:
  - year: 1930
    precision: year
    title: "Przeniesienie do Princeton"
    original_title: "Move to Princeton"
    summary: "Von Neumann rozpoczął pracę w Stanach Zjednoczonych i później został jednym z pierwszych profesorów Institute for Advanced Study."
    summary_original: "Von Neumann began work in the United States and later became one of the first professors at the Institute for Advanced Study."
  - year: 1943
    precision: year
    title: "Praca przy Projekcie Manhattan"
    original_title: "Work on the Manhattan Project"
    summary: "W Los Alamos zajmował się m.in. hydrodynamiką fal uderzeniowych, obliczeniami i projektowaniem implozji."
    summary_original: "At Los Alamos he worked on shock-wave hydrodynamics, computation and implosion design."
