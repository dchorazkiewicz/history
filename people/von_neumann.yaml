image: null
summary: "Węgiersko-amerykański matematyk i polimat, jeden z najważniejszych uczonych XX wieku. Wniósł fundamentalny wkład do podstaw mechaniki kwantowej, analizy funkcjonalnej, teorii operatorów, teorii gier, architektury komputerów, metod numerycznych i badań nad bronią jądrową."
summary_original: "Hungarian-American mathematician and polymath, one of the most important scientists of the twentieth century. He made fundamental contributions to quantum mechanics, functional analysis, operator theory, game theory, computer architecture, numerical methods and nuclear-weapons research."
