summary: "Amerykański fizyk eksperymentalny, znany z pomiaru elementarnego ładunku elektrycznego oraz precyzyjnych badań efektu fotoelektrycznego. Odegrał też kluczową rolę w rozwoju Caltech jako ośrodka fizyki."
summary_original: "American experimental physicist known for measuring the elementary electric charge and for precise studies of the photoelectric effect. He also played a key role in building Caltech into a major physics center."
