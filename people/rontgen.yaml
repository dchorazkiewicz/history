summary: "Niemiecki fizyk, odkrywca promieni X. W 1895 r. zauważył niewidzialne promieniowanie przenikające materiały nieprzezroczyste dla światła widzialnego i wykonał jedne z pierwszych zdjęć rentgenowskich, otwierając nową epokę diagnostyki medycznej i fizyki promieniowania."
summary_original: "German physicist who discovered X-rays. In 1895 he observed invisible radiation capable of penetrating materials opaque to visible light and produced some of the first radiographs, opening a new era in medical diagnosis and radiation physics."
