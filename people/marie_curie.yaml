    precision: year
    title: "Odkrycie polonu i radu"
    original_title: "Discovery of polonium and radium"
    summary: "Maria i Pierre Curie ogłosili dwa nowe pierwiastki na podstawie badań blendy smolistej."
    summary_original: "Marie and Pierre Curie announced two new elements from studies of pitchblende."
  - year: 1903
    precision: year
    title: "Nagroda Nobla w dziedzinie fizyki"
    original_title: "Nobel Prize in Physics"
    summary: "Maria Curie, Pierre Curie i Henri Becquerel zostali nagrodzeni za badania nad promieniotwórczością."
    summary_original: "Marie Curie, Pierre Curie and Henri Becquerel were honored for research on radioactivity."
  - year: 1911
    precision: year
    title: "Nagroda Nobla w dziedzinie chemii"
    original_title: "Nobel Prize in Chemistry"
    summary: "Curie otrzymała drugiego Nobla za odkrycie polonu i radu oraz izolację radu."
    summary_original: "Curie received a second Nobel Prize for discovering polonium and radium and isolating radium."
