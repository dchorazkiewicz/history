born:
  date: "1867-11-07"
  year: 1867
  precision: day
died:
  date: "1934-07-04"
  year: 1934
  precision: day
place_association: "Warszawa; Paryż"
fields: [physics, chemistry, radioactivity, nuclear_physics, medicine, education]
image: null
summary: "Polsko-francuska fizyczka i chemiczka, pionierka badań promieniotwórczości. Wspólnie z Pierre’em Curie odkryła polon i rad, rozwinęła metody izolacji substancji promieniotwórczych i została pierwszą osobą nagrodzoną Noblem w dwóch różnych dziedzinach naukowych."
summary_original: "Polish-French physicist and chemist, a pioneer of radioactivity research. With Pierre Curie she discovered polonium and radium, developed methods for isolating radioactive substances, and became the first person to receive Nobel Prizes in two different scientific fields."
works:
  - title: "Badania nad substancjami promieniotwórczymi"
    original_title: "Recherches sur les substances radioactives"
    year: 1903
    precision: year
    type: scientific_treatise
    publication_note: "Rozprawa doktorska Marii Curie."
    publication_note_original: "Marie Curie's doctoral thesis."
  - title: "Traktat o promieniotwórczości"
    original_title: "Traité de radioactivité"
    year: 1910
    precision: year
    type: scientific_treatise
ideas:
  - name: "Promieniotwórczość jako własność atomu"
    original_name: "Radioactivity as an atomic property"
    summary: "Curie wykazała, że intensywność promieniowania zależy od ilości pierwiastka, a nie od jego stanu chemicznego, co wskazywało na wewnętrzne źródło atomowe."
    summary_original: "Curie showed that radiation intensity depends on the amount of an element rather than its chemical state, pointing to an internal atomic source."
  - name: "Polon"
    original_name: "Polonium"
    wikipedia: "https://en.wikipedia.org/wiki/Polonium"
    summary: "W 1898 r. Maria i Pierre Curie ogłosili odkrycie nowego silnie promieniotwórczego pierwiastka nazwanego na cześć Polski."
    summary_original: "In 1898 Marie and Pierre Curie announced a new strongly radioactive element named in honor of Poland."
  - name: "Rad"
    original_name: "Radium"
    wikipedia: "https://en.wikipedia.org/wiki/Radium"
    summary: "W tym samym roku ogłosili istnienie radu, którego związki wykazywały wyjątkowo silną promieniotwórczość."
    summary_original: "The same year they announced radium, whose compounds displayed exceptionally strong radioactivity."
  - name: "Mobilna radiologia podczas I wojny światowej"
    original_name: "Mobile radiology in World War I"
    summary: "Curie organizowała samochodowe stanowiska rentgenowskie i szkoliła personel, aby umożliwić diagnostykę rannych blisko frontu."
    summary_original: "Curie organized mobile X-ray units and trained staff to diagnose wounded soldiers near the front."
events:
