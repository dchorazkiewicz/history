fields: [mathematics, analysis, probability, statistics, celestial_mechanics, astronomy, physics, thermodynamics, political_administration]
image: null
summary: "Francuski matematyk, astronom i fizyk, jedna z głównych postaci matematycznej nauki przełomu XVIII i XIX wieku. Zbudował monumentalną teorię mechaniki nieba, uporządkował teorię prawdopodobieństwa, rozwijał teorię potencjału i stosował matematykę do astronomii, fizyki, geodezji i statystyki."
summary_original: "French mathematician, astronomer and physicist, one of the central figures of mathematical science around 1800. He built a monumental theory of celestial mechanics, systematized probability theory, advanced potential theory and applied mathematics to astronomy, physics, geodesy and statistics."
works:
  - title: "Przedstawienie systemu świata"
    original_title: "Exposition du système du monde"
    year: 1796
    precision: year
    type: astronomical_treatise
  - title: "Mechanika nieba"
    original_title: "Mécanique céleste"
    wikipedia: "https://en.wikipedia.org/wiki/M%C3%A9canique_c%C3%A9leste"
    year: 1799
    precision: year
    type: scientific_treatise
    publication_note: "Pierwszy tom ukazał się w 1799 r.; pięciotomowe dzieło było publikowane do 1825 r."
    publication_note_original: "The first volume appeared in 1799; the five-volume work continued through 1825."
  - title: "Analityczna teoria prawdopodobieństwa"
    original_title: "Théorie analytique des probabilités"
