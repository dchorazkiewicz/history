    original_name: "Yang–Mills theory"
    wikipedia: "https://en.wikipedia.org/wiki/Yang%E2%80%93Mills_theory"
    summary: "Uogólnia elektromagnetyczną teorię cechowania na nieabelowe grupy symetrii i stanowi matematyczny rdzeń współczesnych teorii oddziaływań fundamentalnych."
    summary_original: "It generalizes electromagnetic gauge theory to non-Abelian symmetry groups and forms the mathematical core of modern fundamental interactions."
  - name: "Łamanie parzystości"
    original_name: "Parity violation"
    summary: "Yang i Lee wykazali, że zachowanie parzystości w słabych oddziaływaniach nie było eksperymentalnie potwierdzone i zaproponowali testy ujawniające jego naruszenie."
    summary_original: "Yang and Lee showed that parity conservation in weak interactions lacked experimental confirmation and proposed tests revealing its violation."
