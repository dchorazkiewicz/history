summary: "Chińsko-amerykański fizyk teoretyczny, współtwórca teorii Yanga-Millsa i jeden z głównych autorów przełomu dotyczącego łamania parzystości w oddziaływaniach słabych. Jego prace nad teoriami cechowania stały się fundamentem Modelu Standardowego."
summary_original: "Chinese-American theoretical physicist, co-creator of Yang–Mills theory and a principal author of the breakthrough on parity violation in weak interactions. His work on gauge theories became foundational to the Standard Model."
