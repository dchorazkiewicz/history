    original_name: "Transcendence of pi"
    wikipedia: "https://en.wikipedia.org/wiki/Transcendental_number"
    summary: "Lindemann udowodnił, że π nie jest pierwiastkiem żadnego niezerowego wielomianu o współczynnikach całkowitych."
    summary_original: "Lindemann proved that pi is not a root of any nonzero polynomial with integer coefficients."
  - name: "Niemożliwość kwadratury koła"
    original_name: "Impossibility of squaring the circle"
    summary: "Z przestępności π wynika, że nie można skonstruować cyrklem i linijką kwadratu o polu równym polu danego koła."
    summary_original: "The transcendence of pi implies that a square equal in area to a given circle cannot be constructed with straightedge and compass."
