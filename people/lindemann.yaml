summary: "Niemiecki matematyk znany przede wszystkim z dowodu przestępności liczby π. Wynik z 1882 r. ostatecznie rozstrzygnął starożytny problem kwadratury koła za pomocą cyrkla i linijki."
summary_original: "German mathematician best known for proving the transcendence of pi. His 1882 result finally settled the ancient problem of squaring the circle with straightedge and compass."
