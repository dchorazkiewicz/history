summary: "Matematyk radziecki i amerykański o niezwykle szerokim wpływie. Jego szkoła obejmowała analizę funkcjonalną, teorię reprezentacji, algebry operatorowe, równania różniczkowe i fizykę matematyczną, a później także zastosowania matematyki w biologii."
summary_original: "Soviet and American mathematician of exceptionally broad influence. His school spanned functional analysis, representation theory, operator algebras, differential equations and mathematical physics, later extending into mathematical approaches to biology."
