summary: "Amerykański matematyk, którego prace przekształciły topologię różniczkową i teorię układów dynamicznych. Odkrył egzotyczne sfery — rozmaitości homeomorficzne, ale nie dyfeomorficzne ze standardową sferą."
summary_original: "American mathematician whose work transformed differential topology and dynamical systems. He discovered exotic spheres—manifolds homeomorphic but not diffeomorphic to the standard sphere."
