image: null
summary: "Brytyjski matematyk, jeden z głównych twórców nowoczesnej analitycznej teorii liczb. Wspólnie z Littlewoodem rozwinął metodę kołową i teorię aproksymacji diofantycznych, a jego współpraca z Ramanujanem należy do najsłynniejszych partnerstw w historii matematyki."
summary_original: "British mathematician and a major creator of modern analytic number theory. With Littlewood he developed the circle method and Diophantine approximation, while his collaboration with Ramanujan became one of the most famous partnerships in mathematical history."
