ideas:
  - name: "Metoda Hardy’ego-Littlewooda"
    original_name: "Hardy–Littlewood circle method"
    wikipedia: "https://en.wikipedia.org/wiki/Hardy%E2%80%93Littlewood_circle_method"
    summary: "Metoda używa analizy zespolonej i szeregów wykładniczych do badania problemów addytywnej teorii liczb."
    summary_original: "The method uses complex analysis and exponential sums to study additive number-theory problems."
  - name: "Prawo Hardy’ego-Weinberga"
    original_name: "Hardy–Weinberg principle"
    wikipedia: "https://en.wikipedia.org/wiki/Hardy%E2%80%93Weinberg_principle"
    summary: "Hardy niezależnie podał prosty model stabilności częstości alleli w idealizowanej populacji, pokazując zastosowanie rachunku algebraicznego w genetyce populacyjnej."
    summary_original: "Hardy independently gave a simple model for stable allele frequencies in an idealized population, showing an application of algebraic reasoning to population genetics."
  - name: "Czysta matematyka jako wartość intelektualna"
    original_name: "Pure mathematics as intellectual value"
    summary: "W Apologii matematyka bronił matematyki czystej jako działalności twórczej i estetycznej, pozostawiając jeden z najbardziej wpływowych tekstów o kulturze matematycznej."
    summary_original: "In A Mathematician's Apology he defended pure mathematics as a creative and aesthetic activity, leaving one of the most influential texts on mathematical culture."
