    summary: "Hardy otrzymał niezwykły list z Indii zawierający wyniki Ramanujana i szybko rozpoznał jego wyjątkowy talent."
    summary_original: "Hardy received an extraordinary letter from India containing Ramanujan's results and quickly recognized his exceptional talent."
