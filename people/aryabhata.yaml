    url: "https://mathshistory.st-andrews.ac.uk/Biographies/Aryabhata_I/"
  - title: "MacTutor — Aryabhata and his commentators"
    url: "https://mathshistory.st-andrews.ac.uk/Projects/Pearce/chapter-10/"
  - title: "MacTutor — Indian mathematics"
    url: "https://mathshistory.st-andrews.ac.uk/HistTopics/Indian_mathematics/"
