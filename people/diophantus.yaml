    url: "https://mathshistory.st-andrews.ac.uk/Biographies/Diophantus/"
  - title: "MacTutor — history of Diophantus and Fermat"
    url: "https://mathshistory.st-andrews.ac.uk/Extras/Weil_history/"
  - title: "Wikipedia — Diophantus"
    url: "https://en.wikipedia.org/wiki/Diophantus"
