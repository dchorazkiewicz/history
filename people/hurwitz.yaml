    year: 1893
    precision: year
    type: mathematical_essay
ideas:
  - name: "Twierdzenie Hurwitza o automorfizmach powierzchni Riemanna"
    original_name: "Hurwitz automorphism theorem"
    summary: "Dla zwartej powierzchni Riemanna rodzaju większego niż jeden liczba automorfizmów jest ograniczona przez 84(g−1)."
    summary_original: "For a compact Riemann surface of genus greater than one, the number of automorphisms is bounded by 84(g−1)."
  - name: "Twierdzenie Hurwitza w analizie zespolonej"
    original_name: "Hurwitz theorem in complex analysis"
    summary: "Granica odpowiednio zbieżnego ciągu funkcji holomorficznych dziedziczy silne własności dotyczące zer."
    summary_original: "The limit of a suitably convergent sequence of holomorphic functions inherits strong properties concerning zeros."
