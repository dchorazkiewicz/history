summary: "Niemiecki matematyk pracujący nad analizą zespoloną, teorią liczb, geometrią algebraiczną i topologią. Jego nazwisko noszą ważne twierdzenia o funkcjach holomorficznych, powierzchniach Riemanna i algebrach."
summary_original: "German mathematician who worked in complex analysis, number theory, algebraic geometry and topology. His name is attached to important theorems on holomorphic functions, Riemann surfaces and algebras."
