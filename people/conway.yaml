image: null
summary: "Brytyjski matematyk o wyjątkowo szerokim i twórczym dorobku. Badał grupy sporadyczne, teorię węzłów, liczby, kody i gry kombinatoryczne, stworzył liczby surrealne i Game of Life, który stał się ikoną automatów komórkowych."
summary_original: "British mathematician of exceptionally broad and creative scope. He worked on sporadic groups, knot theory, number theory, codes and combinatorial games, created surreal numbers and invented the Game of Life, an icon of cellular automata."
