    publication_note_original: "Written with Elwyn Berlekamp and Richard Guy."
ideas:
  - name: "Game of Life"
    original_name: "Conway's Game of Life"
    wikipedia: "https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life"
    summary: "Prosty automat komórkowy na siatce kwadratowej pokazuje, jak z kilku lokalnych reguł mogą powstawać bardzo złożone struktury i procesy."
    summary_original: "A simple cellular automaton on a square grid shows how a few local rules can generate highly complex structures and processes."
  - name: "Liczby surrealne"
    original_name: "Surreal numbers"
    wikipedia: "https://en.wikipedia.org/wiki/Surreal_number"
    summary: "Conway stworzył ogromny system liczb obejmujący liczby rzeczywiste, nieskończenie duże i nieskończenie małe w jednej konstrukcji."
    summary_original: "Conway created a vast number system containing real numbers, infinite and infinitesimal quantities within a single construction."
  - name: "Grupy Conwaya"
    original_name: "Conway groups"
    summary: "Badając symetrie kraty Leecha odkrył sporadyczne grupy proste, które stały się ważnym elementem klasyfikacji skończonych grup prostych."
    summary_original: "While studying symmetries of the Leech lattice he discovered sporadic simple groups important to the classification of finite simple groups."
