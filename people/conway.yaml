    original_title: "Discovery of the Conway groups"
    summary: "Analiza symetrii kraty Leecha doprowadziła do nowych sporadycznych grup prostych."
    summary_original: "Analysis of Leech lattice symmetries led to new sporadic simple groups."
  - year: 1970
    precision: year
    title: "Game of Life"
    original_title: "Game of Life"
    summary: "Gra została spopularyzowana przez Martina Gardnera w Scientific American i stała się jednym z najbardziej znanych modeli emergencji."
    summary_original: "The game was popularized by Martin Gardner in Scientific American and became one of the best-known models of emergence."
