summary: "Francuski matematyk, ważny twórca teorii miary i nowoczesnego rachunku prawdopodobieństwa. Jego prace nad zbiorami mierzalnymi, zbieżnością i probabilistycznym opisem zjawisk stały się fundamentem późniejszej analizy."
summary_original: "French mathematician and a major creator of measure theory and modern probability. His work on measurable sets, convergence and probabilistic descriptions became foundational to later analysis."
