ideas:
  - name: "Wątpienie metodyczne"
    original_name: "Methodic doubt"
    summary: "Strategia polegająca na wstrzymywaniu zgody na przekonania, które można podać w wątpliwość, aby odnaleźć pewne podstawy wiedzy."
    summary_original: "A strategy of withholding assent from beliefs that can be doubted in order to seek secure foundations."
  - name: "Cogito"
    original_name: "Cogito"
    summary: "Istnienie podmiotu myślącego jest przedstawione jako niemożliwe do podważenia w samym akcie myślenia."
    summary_original: "The thinking subject's existence is presented as indubitable in the act of thinking."
  - name: "Dualizm umysłu i ciała"
    original_name: "Mind–body dualism"
    summary: "Umysł określa myślenie, a ciało rozciągłość; to rozróżnienie stało się jednym z głównych problemów filozofii nowożytnej."
    summary_original: "Mind is characterized by thought and body by extension, creating a central early-modern mind–body problem."
  - name: "Fizyka mechanistyczna"
    original_name: "Mechanistic physics"
    summary: "Zjawiska przyrody wyjaśniane są przez materię, ruch oraz zasady geometryczne i mechaniczne."
    summary_original: "Natural phenomena are explained through matter, motion and geometrical-mechanical principles."
events:
  - year: 1633
    title: "Wstrzymanie publikacji Świata"
    original_title: "Withheld The World"
    summary: "Po wiadomości o potępieniu Galileusza Kartezjusz odłożył publikację swojego traktatu kosmologicznego."
    summary_original: "After learning of Galileo's condemnation, Descartes postponed publication of his cosmological treatise."
sources:
