ideas:
  - name: "Methodic doubt"
    summary: "A strategy of withholding assent from beliefs that can be doubted in order to seek secure foundations."
  - name: "Cogito"
    summary: "The thinking subject's existence is presented as indubitable in the act of thinking."
  - name: "Mind–body dualism"
    summary: "Mind is characterized by thought and body by extension, creating a central early-modern mind–body problem."
  - name: "Mechanistic physics"
    summary: "Natural phenomena are explained through matter, motion and geometrical-mechanical principles."
