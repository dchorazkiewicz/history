ideas:
  - name: "Paradoks Russella"
    original_name: "Russell's paradox"
    wikipedia: "https://en.wikipedia.org/wiki/Russell%27s_paradox"
    summary: "Paradoks zbioru wszystkich zbiorów, które nie zawierają samych siebie, ujawnił sprzeczności naiwnej teorii mnogości."
    summary_original: "The paradox of the set of all sets that are not members of themselves exposed contradictions in naive set theory."
  - name: "Teoria typów"
    original_name: "Type theory"
    summary: "Russell próbował uniknąć paradoksów przez hierarchiczne rozdzielenie poziomów obiektów i wyrażeń."
    summary_original: "Russell sought to avoid paradoxes by hierarchically separating levels of objects and expressions."
  - name: "Teoria deskrypcji"
    original_name: "Theory of descriptions"
    summary: "Analiza zdań z opisami określonymi stała się jednym z klasycznych narzędzi filozofii analitycznej."
    summary_original: "The analysis of sentences containing definite descriptions became a classic tool of analytic philosophy."
