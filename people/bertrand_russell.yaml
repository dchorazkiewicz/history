summary: "Brytyjski filozof, logik i matematyk, jedna z centralnych postaci filozofii analitycznej. Wspólnie z Alfredem N. Whiteheadem stworzył Principia Mathematica, rozwijał logicyzm i teorię typów, a także wywarł ogromny wpływ jako eseista i intelektualista publiczny."
summary_original: "British philosopher, logician and mathematician, one of the central figures of analytic philosophy. With Alfred North Whitehead he wrote Principia Mathematica, developed logicism and type theory, and had enormous influence as an essayist and public intellectual."
