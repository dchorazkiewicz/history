image: null
summary: "Radziecki fizyk teoretyczny o niezwykle szerokim dorobku. Stworzył teorię nadciekłości helu II, rozwijał teorię przejść fazowych, diamagnetyzm kwantowy, fizykę plazmy i teorię cieczy Fermiego."
summary_original: "Soviet theoretical physicist of exceptionally broad scope. He created the theory of helium-II superfluidity and advanced phase transitions, quantum diamagnetism, plasma physics and Fermi-liquid theory."
