summary: "Austriacki fizyk teoretyczny, twórca mechaniki falowej i równania Schrödingera. Pracował również nad statystyką, podstawami mechaniki kwantowej i filozofią nauki; jego książka What Is Life? wpłynęła na część twórców biologii molekularnej."
summary_original: "Austrian theoretical physicist, creator of wave mechanics and the Schrödinger equation. He also worked on statistics, quantum foundations and philosophy of science; his book What Is Life? influenced some founders of molecular biology."
