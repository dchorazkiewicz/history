summary: "Amerykański fizyk, odkrywca efektu Comptona. Wykazał, że promieniowanie rentgenowskie podczas zderzeń z elektronami zachowuje się jak strumień kwantów mających energię i pęd."
summary_original: "American physicist who discovered the Compton effect. He showed that X-rays scattering from electrons behave like quanta carrying both energy and momentum."
