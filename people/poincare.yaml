ideas:
  - name: "Topologia algebraiczna"
    original_name: "Algebraic topology"
    summary: "Poincaré wprowadził systematyczne użycie niezmienników algebraicznych do klasyfikowania przestrzeni topologicznych."
    summary_original: "Poincaré introduced systematic use of algebraic invariants to classify topological spaces."
  - name: "Jakościowa teoria układów dynamicznych"
    original_name: "Qualitative theory of dynamical systems"
    summary: "Zamiast szukać wyłącznie dokładnych wzorów rozwiązań badał globalne zachowanie trajektorii, stabilność, punkty okresowe i rozmaitości niezmiennicze."
    summary_original: "Instead of seeking only exact formulas, he studied global trajectory behavior, stability, periodic points and invariant manifolds."
  - name: "Wrażliwość w problemie trzech ciał"
    original_name: "Sensitivity in the three-body problem"
    summary: "Analiza przecięć rozmaitości stabilnych i niestabilnych ujawniła niezwykle złożone zachowania, dziś uznawane za prekursorskie wobec teorii chaosu."
    summary_original: "Analysis of intersections of stable and unstable manifolds revealed highly complex behavior now regarded as a precursor of chaos theory."
  - name: "Wkład poprzedzający szczególną teorię względności"
    original_name: "Pre-relativity contributions"
    summary: "Poincaré analizował zasadę względności, synchronizację zegarów i transformacje Lorentza. Jego prace były ważnym elementem kontekstu, w którym powstała szczególna teoria względności, choć nie należy utożsamiać ich z pełnym sformułowaniem Einsteina."
    summary_original: "Poincaré analyzed the relativity principle, clock synchronization and Lorentz transformations. His work formed an important part of the context in which special relativity emerged, though it should not be equated with Einstein's full formulation."
events:
  - year: 1887
    precision: year
    title: "Konkurs króla Oskara II o problemie trzech ciał"
    original_title: "King Oscar II competition on the three-body problem"
    summary: "Poincaré zdobył nagrodę za pracę o stabilności Układu Słonecznego, która doprowadziła do odkrycia złożonych zachowań dynamicznych."
    summary_original: "Poincaré won the prize for work on Solar System stability that led to discoveries of complex dynamical behavior."
  - year: 1895
    precision: year
    title: "Publikacja Analysis Situs"
    original_title: "Publication of Analysis Situs"
    summary: "Praca zapoczątkowała systematyczną topologię algebraiczną."
    summary_original: "The work launched systematic algebraic topology."
