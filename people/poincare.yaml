image: null
summary: "Francuski matematyk, fizyk matematyczny i filozof nauki. Stworzył podstawy topologii algebraicznej i jakościowej teorii układów dynamicznych, badał problem trzech ciał, chaos deterministyczny, elektromagnetyzm i strukturę transformacji związanych z teorią względności."
summary_original: "French mathematician, mathematical physicist and philosopher of science. He laid foundations of algebraic topology and qualitative dynamical systems, studied the three-body problem and deterministic chaos, and worked on electromagnetism and transformation structures connected with relativity."
