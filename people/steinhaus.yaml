  - name: "Twierdzenie Steinhausa o zbiorach dodatniej miary"
    original_name: "Steinhaus theorem"
    summary: "Jeśli zbiór na prostej ma dodatnią miarę, to jego zbiór różnic zawiera otoczenie zera."
    summary_original: "If a subset of the line has positive measure, then its difference set contains a neighborhood of zero."
  - name: "Probabilistyczne spojrzenie na matematykę stosowaną"
    original_name: "Probabilistic view of applied mathematics"
    summary: "Steinhaus stosował rachunek prawdopodobieństwa i statystykę do problemów praktycznych, od pomiarów po teorię gier i decyzji."
    summary_original: "Steinhaus applied probability and statistics to practical problems ranging from measurement to games and decision problems."
  - name: "Lwowska szkoła matematyczna"
    original_name: "Lwów school of mathematics"
    summary: "Wspólnie z Banachem i innymi stworzył środowisko, w którym problemy matematyczne dyskutowano intensywnie w Kawiarni Szkockiej."
    summary_original: "With Banach and others he created a community where mathematical problems were intensely discussed in the Scottish Café."
