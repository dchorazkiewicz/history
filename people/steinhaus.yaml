summary: "Polski matematyk, współtwórca lwowskiej szkoły matematycznej, badacz analizy funkcjonalnej, probabilistyki i zastosowań matematyki. Odkrył talent Stefana Banacha i przez całe życie popularyzował matematyczne myślenie."
summary_original: "Polish mathematician and co-founder of the Lwów school of mathematics, working in functional analysis, probability and applications. He discovered Stefan Banach's talent and spent his life popularizing mathematical thinking."
