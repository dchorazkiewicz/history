    precision: year
    type: mathematical_treatise
    publication_note: "Pierwsza wersja powstała w 1202 r.; Fibonacci przygotował gruntownie zrewidowane wydanie w 1228 r."
    publication_note_original: "The first version was written in 1202; Fibonacci produced a substantially revised edition in 1228."
