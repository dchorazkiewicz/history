image: null
summary: "Włoski matematyk znany jako Leonardo z Pizy. Dzięki kontaktom handlowym i nauce w Afryce Północnej poznał matematykę świata islamu, a w Liber Abaci przedstawił łacińskiej Europie praktyczne zalety systemu indoarabskiego i rozwiniętych metod algebraicznych."
summary_original: "Italian mathematician known as Leonardo of Pisa. Through commercial contacts and study in North Africa he encountered mathematics of the Islamic world, and in the Liber Abaci presented Latin Europe with the practical advantages of Hindu-Arabic numerals and advanced algebraic methods."
works:
  - title: "Księga rachunku"
