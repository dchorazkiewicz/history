summary: "Amerykański matematyk, jeden z głównych twórców topologii różniczkowej i nowoczesnej teorii układów dynamicznych. Udowodnił hipotezę Poincarégo w wymiarach co najmniej pięciu i wprowadził słynny podkowiasty model chaosu."
summary_original: "American mathematician, a major creator of differential topology and modern dynamical systems. He proved the Poincaré conjecture in dimensions at least five and introduced the famous horseshoe model of chaos."
