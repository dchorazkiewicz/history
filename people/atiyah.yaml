summary: "Brytyjski matematyk o ogromnym wpływie na topologię, geometrię i fizykę matematyczną. Wspólnie z Isadorem Singerem sformułował twierdzenie indeksowe, a z Hirzebruchem rozwijał K-teorię topologiczną."
summary_original: "British mathematician of enormous influence on topology, geometry and mathematical physics. With Isadore Singer he formulated the index theorem, while with Hirzebruch he developed topological K-theory."
