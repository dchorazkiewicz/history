summary: "Włoski matematyk i logik, ważny twórca formalnego języka matematyki. Sformułował aksjomaty arytmetyki liczb naturalnych, rozwijał zapis logiczny i teorię mnogości oraz eksperymentował z międzynarodowym językiem Latino sine flexione."
summary_original: "Italian mathematician and logician, an important creator of formal mathematical language. He formulated axioms for natural-number arithmetic, advanced logical and set-theoretic notation, and experimented with the international language Latino sine flexione."
