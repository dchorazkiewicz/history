    summary: "Peano uporządkował arytmetykę liczb naturalnych w system aksjomatów dotyczących zera, następnika i indukcji."
    summary_original: "Peano organized natural-number arithmetic into axioms involving zero, successor and induction."
  - name: "Krzywa Peana"
