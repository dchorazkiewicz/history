    summary: "W 1890 r. skonstruował ciągłą krzywą wypełniającą cały kwadrat, podważając intuicję o wymiarze."
    summary_original: "In 1890 he constructed a continuous curve filling an entire square, challenging intuition about dimension."
  - name: "Formalny język matematyki"
    original_name: "Formal mathematical notation"
    summary: "Peano i jego szkoła rozwinęli zwięzły system symboli logicznych i mnogościowych, który wpłynął na późniejsze standardy zapisu."
    summary_original: "Peano and his school developed a concise logical and set-theoretic notation that influenced later standards."
