ideas:
  - name: "Maszyna Turinga"
    original_name: "Turing machine"
    wikipedia: "https://en.wikipedia.org/wiki/Turing_machine"
    summary: "Abstrakcyjna maszyna operująca na taśmie i skończonym zestawie reguł stała się fundamentalnym modelem algorytmu."
    summary_original: "An abstract machine operating on a tape under a finite rule set became a fundamental model of algorithmic computation."
  - name: "Problem stopu"
    original_name: "Halting problem"
    wikipedia: "https://en.wikipedia.org/wiki/Halting_problem"
    summary: "Turing pokazał, że nie istnieje uniwersalny algorytm rozstrzygający dla każdego programu, czy jego wykonanie kiedyś się zatrzyma."
    summary_original: "Turing showed that no universal algorithm can decide for every program whether it will eventually halt."
  - name: "Test Turinga"
    original_name: "Turing test"
    wikipedia: "https://en.wikipedia.org/wiki/Turing_test"
    summary: "Zaproponował operacyjne kryterium dyskusji o inteligencji maszyn oparte na zdolności do prowadzenia rozmowy nieodróżnialnej od ludzkiej."
    summary_original: "He proposed an operational criterion for discussing machine intelligence based on conversational indistinguishability from a human."
  - name: "Wzory Turinga w morfogenezie"
    original_name: "Turing patterns"
    wikipedia: "https://en.wikipedia.org/wiki/Turing_pattern"
    summary: "Pokazał, że reakcje chemiczne sprzężone z dyfuzją mogą spontanicznie tworzyć przestrzenne wzory biologiczne."
    summary_original: "He showed that chemical reactions coupled with diffusion can spontaneously generate biological spatial patterns."
events:
  - year: 1939
    precision: year
    title: "Rozpoczęcie pracy w Bletchley Park"
    original_title: "Beginning work at Bletchley Park"
    summary: "Turing pracował nad metodami ataku na szyfry Enigmy i nad projektami maszyn wspierających kryptanalizę."
    summary_original: "Turing worked on methods for attacking Enigma ciphers and on machine designs supporting cryptanalysis."
  - year: 1945
    precision: year
    title: "Projekt ACE"
    original_title: "ACE design"
    summary: "W National Physical Laboratory zaproponował projekt Automatic Computing Engine, jednego z najambitniejszych wczesnych komputerów elektronicznych."
    summary_original: "At the National Physical Laboratory he proposed the Automatic Computing Engine, one of the most ambitious early electronic computer designs."
