image: null
summary: "Brytyjski matematyk, logik i kryptanalityk, jedna z najważniejszych postaci historii informatyki. Sformalizował pojęcie obliczenia za pomocą maszyny Turinga, odegrał kluczową rolę w łamaniu niemieckich szyfrów podczas II wojny światowej, pracował nad pierwszymi komputerami i zapoczątkował badania nad sztuczną inteligencją oraz morfogenezą."
summary_original: "British mathematician, logician and cryptanalyst, one of the most important figures in the history of computing. He formalized computation with the Turing machine, played a key role in breaking German ciphers during World War II, worked on early computers and initiated research in artificial intelligence and morphogenesis."
