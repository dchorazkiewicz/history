    year: 1939
    precision: year
    type: scientific_treatise
ideas:
  - name: "Cykl CNO"
    original_name: "CNO cycle"
    wikipedia: "https://en.wikipedia.org/wiki/CNO_cycle"
    summary: "Bethe wyjaśnił katalityczny cykl reakcji termojądrowych, który dominuje w produkcji energii w masywniejszych gwiazdach."
    summary_original: "Bethe explained the catalytic fusion cycle that dominates energy production in more massive stars."
  - name: "Łańcuch proton-proton"
    original_name: "Proton–proton chain"
    summary: "Jego prace pomogły ustalić mechanizm syntezy helu z wodoru zasilający gwiazdy podobne do Słońca."
    summary_original: "His work helped establish the hydrogen-to-helium fusion mechanism powering stars like the Sun."
  - name: "Przesunięcie Lamba i renormalizacja"
    original_name: "Lamb shift and renormalization"
    summary: "Bethe podał pierwsze skuteczne obliczenie przesunięcia Lamba, pomagając zapoczątkować nowoczesną renormalizowaną elektrodynamikę kwantową."
    summary_original: "Bethe gave the first successful calculation of the Lamb shift, helping launch modern renormalized quantum electrodynamics."
