image: null
summary: "Niemiecko-amerykański fizyk teoretyczny o niezwykle szerokim dorobku. Wyjaśnił główne cykle reakcji jądrowych zasilających gwiazdy, pracował nad fizyką jądrową i elektrodynamiką kwantową oraz kierował działem teoretycznym Los Alamos podczas Projektu Manhattan."
summary_original: "German-American theoretical physicist of exceptionally broad scope. He explained the principal nuclear reaction cycles powering stars, worked on nuclear physics and quantum electrodynamics, and led the theoretical division at Los Alamos during the Manhattan Project."
works:
  - title: "Produkcja energii w gwiazdach"
