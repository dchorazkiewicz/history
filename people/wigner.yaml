summary: "Węgiersko-amerykański fizyk matematyczny, który wprowadził teorię grup do centrum mechaniki kwantowej i fizyki jądrowej. Jego twierdzenia o symetriach i reprezentacjach stały się podstawowym językiem fizyki cząstek."
summary_original: "Hungarian-American mathematical physicist who brought group theory to the center of quantum mechanics and nuclear physics. His results on symmetries and representations became basic language in particle physics."
