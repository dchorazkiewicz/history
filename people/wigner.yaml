    summary: "Wigner został nagrodzony za wkład do teorii jądra i cząstek elementarnych, szczególnie przez odkrycie i zastosowanie zasad symetrii."
    summary_original: "Wigner was honored for contributions to nuclear and particle theory, especially discovery and application of symmetry principles."
