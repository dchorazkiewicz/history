    summary: "Symetrie zachowujące prawdopodobieństwa przejść kwantowych są reprezentowane przez operatory unitarne lub antyunitarne."
    summary_original: "Symmetries preserving quantum transition probabilities are represented by unitary or antiunitary operators."
  - name: "Klasyfikacja cząstek przez symetrie"
    original_name: "Symmetry classification of particles"
    summary: "Wigner pokazał, jak reprezentacje grup symetrii organizują stany kwantowe i własności cząstek."
    summary_original: "Wigner showed how representations of symmetry groups organize quantum states and particle properties."
  - name: "Macierz Wignera"
    original_name: "Wigner distribution"
    summary: "Funkcja quasi-prawdopodobieństwa pozwala przedstawiać stan kwantowy w przestrzeni fazowej."
    summary_original: "A quasiprobability distribution represents quantum states in phase space."
