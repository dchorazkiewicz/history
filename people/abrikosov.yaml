summary: "Radziecki i amerykański fizyk teoretyczny, który rozwinął teorię nadprzewodników typu II. Przewidział strukturę wirów magnetycznych w takich materiałach, dziś znaną jako sieć Abrikosowa."
summary_original: "Soviet and American theoretical physicist who developed the theory of type-II superconductors. He predicted the magnetic vortex structure in such materials, now known as the Abrikosov lattice."
