    summary: "Abrikosow pokazał, że pewna klasa nadprzewodników może przepuszczać pole magnetyczne w postaci skwantowanych wirów."
    summary_original: "Abrikosov showed that a class of superconductors can admit magnetic field in the form of quantized vortices."
  - name: "Sieć Abrikosowa"
    original_name: "Abrikosov vortex lattice"
    wikipedia: "https://en.wikipedia.org/wiki/Abrikosov_vortex"
    summary: "W wirującym stanie mieszanym linie strumienia magnetycznego tworzą uporządkowaną sieć."
    summary_original: "In the mixed vortex state, magnetic flux lines form an ordered lattice."
