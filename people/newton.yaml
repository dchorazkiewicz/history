ideas:
  - name: "Trzy zasady dynamiki"
    original_name: "Three laws of motion"
    summary: "Systematyczna podstawa mechaniki klasycznej opisująca związek między ruchem, siłą i bezwładnością."
    summary_original: "A systematic foundation for classical mechanics."
  - name: "Prawo powszechnego ciążenia"
    original_name: "Universal gravitation"
    summary: "Ta sama siła grawitacji o zależności odwrotnej do kwadratu odległości opisuje zjawiska na Ziemi i ruchy ciał niebieskich."
    summary_original: "The same inverse-square gravitational interaction accounts for terrestrial and celestial motions."
  - name: "Rachunek różniczkowy i całkowy / fluksje"
    original_name: "Calculus / fluxions"
    summary: "Newton rozwinął metody rachunku nieskończenie małych niezależnie od Leibniza, używając własnego języka fluksji."
    summary_original: "Developed methods of infinitesimal calculation independently of Leibniz, using his own fluxional notation."
  - name: "Teoria optyczna"
    original_name: "Optical theory"
    summary: "Doświadczenia z pryzmatami wspierały tezę, że światło białe składa się z promieni o różnej łamliwości."
    summary_original: "Prism experiments supported the claim that white light is composed of rays with different refrangibility."
events:
  - year: 1665
    precision: approximate
    title: "Wczesne prace nad rachunkiem, optyką i grawitacją"
    original_title: "Early work on calculus, optics and gravitation"
    summary: "W latach epidemii, spędzonych poza Cambridge, Newton rozwinął kilka najważniejszych kierunków swoich późniejszych badań."
    summary_original: "During the plague years away from Cambridge, Newton developed several foundational lines of research."
  - year: 1687
    title: "Publikacja Principiów"
    original_title: "Publication of Principia"
    summary: "Pierwsze wydanie ukazało się dzięki wsparciu i zachęcie Edmonda Halleya."
    summary_original: "First edition published with support and encouragement from Edmond Halley."
