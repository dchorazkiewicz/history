summary: "Angielski matematyk i filozof przyrody. W Principiach połączył mechanikę ziemską i niebieską, a jego prace gruntownie zmieniły optykę i matematykę."
summary_original: "English mathematician and natural philosopher whose Principia unified terrestrial and celestial mechanics and whose work transformed optics and mathematics."
