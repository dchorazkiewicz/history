summary: "Amerykański fizyk teoretyczny, współtwórca teorii BCS nadprzewodnictwa. Odkrył mechanizm parowania elektronów nazwanych parami Coopera, a później zajmował się także modelami uczenia i neurobiologii."
summary_original: "American theoretical physicist and co-creator of BCS superconductivity theory. He discovered the electron-pairing mechanism now called Cooper pairs and later also worked on learning models and neuroscience."
