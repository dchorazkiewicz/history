ideas:
  - name: "Rozwiązania równań sześciennych i czwartych stopni"
    original_name: "Solutions of cubic and quartic equations"
    summary: "Ars Magna zebrała i opublikowała metody związane z del Ferrem, Tartaglią i Ferrarim, nadając im trwałe miejsce w europejskiej algebrze."
    summary_original: "Ars Magna collected and published methods associated with del Ferro, Tartaglia and Ferrari, securing their place in European algebra."
  - name: "Pierwsze rachunki z pierwiastkami liczb ujemnych"
    original_name: "Early calculations with square roots of negative numbers"
    summary: "Przy analizie równań sześciennych Cardano zetknął się z wyrażeniami zawierającymi pierwiastki z liczb ujemnych, choć uznawał je jeszcze za problematyczne i mało użyteczne."
    summary_original: "While analyzing cubics Cardano encountered expressions involving square roots of negative numbers, though he still regarded them as problematic and of little use."
  - name: "Matematyka hazardu i prawdopodobieństwa"
    original_name: "Mathematics of gambling and probability"
    summary: "W Liber de ludo aleae analizował uczciwe gry, liczby możliwych wyników i szanse zdarzeń, tworząc jeden z najwcześniejszych tekstów teorii prawdopodobieństwa."
    summary_original: "In Liber de ludo aleae he analyzed fair games, numbers of possible outcomes and event chances, producing one of the earliest probability texts."
  - name: "Mechanika i przegub Cardana"
    original_name: "Mechanics and the Cardan joint"
    summary: "Cardano zajmował się mechaniką i urządzeniami; z jego nazwiskiem wiąże się typ przegubu uniwersalnego pozwalającego przenosić obrót między niewspółosiowymi wałami."
    summary_original: "Cardano worked on mechanics and devices; his name is associated with a universal joint transmitting rotation between misaligned shafts."
events:
  - year: 1525
    precision: year
    title: "Doktorat z medycyny"
    original_title: "Doctorate in medicine"
    summary: "Cardano ukończył studia medyczne w Padwie, rozpoczynając karierę, która miała uczynić go jednym z najbardziej znanych lekarzy epoki."
    summary_original: "Cardano completed his medical doctorate at Padua, beginning a career that made him one of the era's most famous physicians."
  - year: 1539
    precision: year
    title: "Poznanie metody Tartaglii"
    original_title: "Learning Tartaglia's cubic method"
    summary: "Tartaglia przekazał Cardanowi swoją metodę rozwiązania równań sześciennych pod przysięgą zachowania tajemnicy."
    summary_original: "Tartaglia disclosed his cubic-solution method to Cardano under a pledge of secrecy."
  - year: 1545
    precision: year
    title: "Publikacja Ars Magna"
    original_title: "Publication of Ars Magna"
    summary: "Publikacja stała się punktem zwrotnym w historii europejskiej algebry."
    summary_original: "The publication became a turning point in the history of European algebra."
