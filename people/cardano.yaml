summary: "Włoski lekarz, matematyk, filozof przyrody i niezwykle płodny autor. W Ars Magna opublikował metody rozwiązywania równań sześciennych i czwartych stopni, zetknął się z liczbami zespolonymi, a w traktacie o grach losowych stworzył jeden z najwcześniejszych systematycznych tekstów teorii prawdopodobieństwa."
summary_original: "Italian physician, mathematician, natural philosopher and extraordinarily prolific author. In Ars Magna he published methods for solving cubic and quartic equations, encountered complex quantities, and in his work on games of chance produced one of the earliest systematic texts on probability."
