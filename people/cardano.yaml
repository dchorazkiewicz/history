    publication_note: "Encyklopedyczne dzieło z filozofii przyrody obejmujące m.in. mechanikę, kosmologię, technikę i zagadnienia przyrodnicze."
    publication_note_original: "An encyclopedic work of natural philosophy covering mechanics, cosmology, technology and natural phenomena."
