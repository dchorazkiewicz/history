    publication_note: "Pierwszy łaciński traktat poświęcony wyłącznie algebrze; zawierał rozwiązania równań sześciennych i czwartych stopni."
    publication_note_original: "The first Latin treatise devoted solely to algebra; it contained solutions of cubic and quartic equations."
