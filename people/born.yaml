    title: "Nagroda Nobla w dziedzinie fizyki"
    original_title: "Nobel Prize in Physics"
    summary: "Born został nagrodzony przede wszystkim za statystyczną interpretację funkcji falowej."
    summary_original: "Born was honored primarily for the statistical interpretation of the wavefunction."
