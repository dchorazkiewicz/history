    publication_note_original: "Work with Werner Heisenberg and Pascual Jordan."
ideas:
  - name: "Reguła Borna"
    original_name: "Born rule"
    wikipedia: "https://en.wikipedia.org/wiki/Born_rule"
    summary: "Kwadrat modułu funkcji falowej jest interpretowany jako gęstość prawdopodobieństwa wyniku pomiaru."
    summary_original: "The squared modulus of the wavefunction is interpreted as the probability density for measurement outcomes."
  - name: "Mechanika macierzowa"
    original_name: "Matrix mechanics"
    summary: "Born rozpoznał, że formalizm Heisenberga ma strukturę rachunku macierzy i wraz z Jordanem pomógł nadać mu pełną postać matematyczną."
    summary_original: "Born recognized the matrix structure of Heisenberg's formalism and with Jordan helped give it a complete mathematical form."
