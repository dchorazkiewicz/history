image: null
summary: "Niemiecko-brytyjski fizyk teoretyczny, jeden z twórców mechaniki kwantowej i szkoły getyńskiej. Zaproponował probabilistyczną interpretację funkcji falowej oraz wniósł fundamentalny wkład do teorii kryształów i dynamiki sieci."
summary_original: "German-British theoretical physicist, a founder of quantum mechanics and the Göttingen school. He proposed the probabilistic interpretation of the wavefunction and made fundamental contributions to crystal theory and lattice dynamics."
