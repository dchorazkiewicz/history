summary: "Niemiecki fizyk znany z praw obwodów elektrycznych i podstaw spektroskopii. Wspólnie z Robertem Bunsenem pokazał, że widma emisyjne i absorpcyjne mogą identyfikować pierwiastki, otwierając drogę do analizy chemicznej gwiazd."
summary_original: "German physicist known for circuit laws and foundations of spectroscopy. With Robert Bunsen he showed that emission and absorption spectra can identify elements, opening the way to chemical analysis of stars."
