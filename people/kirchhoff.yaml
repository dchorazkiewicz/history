    summary: "Prawo węzłowe wyraża zachowanie ładunku, a prawo oczkowe zachowanie energii w obwodach elektrycznych."
    summary_original: "The junction rule expresses charge conservation, while the loop rule expresses energy conservation in electrical circuits."
  - name: "Prawa spektroskopii Kirchhoffa"
    original_name: "Kirchhoff's laws of spectroscopy"
    summary: "Rodzaj widma zależy od stanu materii i warunków emisji lub absorpcji, a linie widmowe stanowią charakterystyczny podpis pierwiastka."
    summary_original: "The type of spectrum depends on the state of matter and emission or absorption conditions, while spectral lines provide characteristic elemental signatures."
  - name: "Prawo promieniowania cieplnego Kirchhoffa"
    original_name: "Kirchhoff's law of thermal radiation"
    wikipedia: "https://en.wikipedia.org/wiki/Kirchhoff%27s_law_of_thermal_radiation"
    summary: "W równowadze cieplnej zdolność emisyjna i absorpcyjna ciała są ze sobą ściśle związane."
    summary_original: "At thermal equilibrium a body's emissive and absorptive powers are tightly related."
