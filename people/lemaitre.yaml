summary: "Belgijski fizyk, matematyk i katolicki ksiądz, pionier kosmologii relatywistycznej. Niezależnie wyprowadził ekspansję Wszechświata z równań Einsteina i zaproponował ideę pierwotnego atomu jako wczesną wersję teorii Wielkiego Wybuchu."
summary_original: "Belgian physicist, mathematician and Catholic priest, a pioneer of relativistic cosmology. He independently derived cosmic expansion from Einstein's equations and proposed the primeval atom, an early form of the Big Bang theory."
