    title: "Hipoteza pierwotnego atomu"
    original_title: "Primeval atom hypothesis"
    summary: "Przedstawił wczesną koncepcję gorącego, gęstego początku Wszechświata."
    summary_original: "He presented an early concept of a hot dense beginning of the universe."
