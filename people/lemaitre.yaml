    year: 1931
    precision: year
    type: scientific_treatise
ideas:
  - name: "Ekspansja Wszechświata"
    original_name: "Expanding universe"
    summary: "Lemaître wyprowadził z ogólnej teorii względności związek między odległością galaktyk a ich prędkością oddalania."
    summary_original: "Lemaître derived from general relativity a relation between galaxy distance and recession speed."
  - name: "Pierwotny atom"
    original_name: "Primeval atom"
    summary: "Proponował, że Wszechświat rozpoczął się w niezwykle gęstym stanie, z którego rozwinęła się obserwowana kosmiczna struktura."
    summary_original: "He proposed that the universe began in an extremely dense state from which observed cosmic structure developed."
