    summary: "Lee i Yang wykazali, że nie istnieją dowody na zachowanie symetrii lustrzanej w procesach słabych i wskazali eksperymenty rozstrzygające."
    summary_original: "Lee and Yang showed there was no evidence for mirror symmetry in weak processes and proposed decisive experiments."
