summary: "Chińsko-amerykański fizyk teoretyczny, współautor z Chen-Ning Yangiem analizy prowadzącej do odkrycia łamania parzystości w słabych oddziaływaniach. Pracował również nad teorią pola, statystyką i fizyką wysokich energii."
summary_original: "Chinese-American theoretical physicist who, with Chen-Ning Yang, led the analysis that revealed parity violation in weak interactions. He also worked on field theory, statistical mechanics and high-energy physics."
