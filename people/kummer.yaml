    year: 1836
    precision: year
    type: mathematical_essay
  - title: "O liczbach idealnych"
    original_title: "Über die idealen Primfactoren der complexen Zahlen"
    year: 1847
    precision: year
    type: mathematical_essay
ideas:
  - name: "Liczby idealne"
    original_name: "Ideal numbers"
    summary: "Kummer wprowadził pomocnicze obiekty przywracające jednoznaczny rozkład na czynniki w pewnych pierścieniach liczb algebraicznych."
    summary_original: "Kummer introduced auxiliary objects restoring unique factorization in certain rings of algebraic integers."
  - name: "Regularne liczby pierwsze i wielkie twierdzenie Fermata"
    original_name: "Regular primes and Fermat's Last Theorem"
    summary: "Udowodnił wielkie twierdzenie Fermata dla szerokiej klasy wykładników pierwszych, dziś nazywanych regularnymi."
    summary_original: "He proved Fermat's Last Theorem for a broad class of prime exponents now called regular primes."
