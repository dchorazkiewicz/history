image: null
summary: "Niemiecki matematyk, który rozwinął teorię liczb algebraicznych, wprowadzając tzw. liczby idealne. Jego prace nad wielkim twierdzeniem Fermata i funkcjami hipergeometrycznymi silnie wpłynęły na późniejszą algebrę i teorię liczb."
summary_original: "German mathematician who advanced algebraic number theory by introducing so-called ideal numbers. His work on Fermat's Last Theorem and hypergeometric functions strongly influenced later algebra and number theory."
