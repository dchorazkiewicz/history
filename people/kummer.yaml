    summary_original: "He began the most intensive period of his work in number theory."
  - year: 1855
    precision: year
    title: "Profesor w Berlinie"
    original_title: "Professor in Berlin"
    summary: "Został jednym z centralnych nauczycieli berlińskiej szkoły matematycznej."
    summary_original: "He became one of the central teachers of the Berlin mathematical school."
