    summary: "Lebesgue przypisał długość znacznie szerszym klasom zbiorów niż klasyczne przedziały i ich proste kombinacje."
    summary_original: "Lebesgue assigned length to far broader classes of sets than classical intervals and their simple combinations."
  - name: "Całka Lebesgue’a"
    original_name: "Lebesgue integral"
    wikipedia: "https://en.wikipedia.org/wiki/Lebesgue_integration"
    summary: "Zamiast dzielić dziedzinę funkcji na małe przedziały, grupował punkty według wartości funkcji, uzyskując potężniejszą teorię całkowania."
    summary_original: "Instead of partitioning a function's domain into small intervals, he grouped points by function value, obtaining a more powerful integration theory."
