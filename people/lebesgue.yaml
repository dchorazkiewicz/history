summary: "Francuski matematyk, twórca teorii miary i całki Lebesgue’a. Jego podejście radykalnie rozszerzyło klasę funkcji, które można sensownie całkować, i stało się podstawą współczesnej analizy, probabilistyki i teorii równań."
summary_original: "French mathematician, creator of Lebesgue measure and integration. His approach radically expanded the class of functions that can be meaningfully integrated and became foundational to modern analysis, probability and differential equations."
