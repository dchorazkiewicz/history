image: null
summary: "Francuski fizyk i inżynier, jeden z twórców termodynamiki. Analizując idealne silniki cieplne zdefiniował odwracalny cykl Carnota i wykazał, że maksymalna sprawność zależy od temperatur źródła i chłodnicy, a nie od szczegółów konstrukcji."
summary_original: "French physicist and engineer, one of the founders of thermodynamics. By analyzing ideal heat engines he defined the reversible Carnot cycle and showed that maximum efficiency depends on hot and cold reservoir temperatures rather than machine details."
