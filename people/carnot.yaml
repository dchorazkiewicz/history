    summary: "Idealny odwracalny cykl wyznacza granicę sprawności silnika działającego między dwiema temperaturami."
    summary_original: "An ideal reversible cycle sets the efficiency limit for an engine operating between two temperatures."
  - name: "Granica sprawności silnika cieplnego"
    original_name: "Heat-engine efficiency limit"
    summary: "Carnot pokazał, że nie istnieje silnik cieplny sprawniejszy od odwracalnego silnika działającego między tymi samymi temperaturami."
    summary_original: "Carnot showed that no heat engine can be more efficient than a reversible engine operating between the same temperatures."
