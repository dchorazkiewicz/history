image: null
summary: "Wietnamsko-francuski matematyk, który udowodnił fundamentalny lemat programu Langlandsa, używając nowych metod geometrii algebraicznej i fibracji Hitchina. Wynik usunął wieloletnią przeszkodę w teorii form automorficznych."
summary_original: "Vietnamese-French mathematician who proved the fundamental lemma of the Langlands program using new algebraic-geometric methods and the Hitchin fibration. The result removed a decades-long obstacle in the theory of automorphic forms."
works:
  - title: "Fundamentalny lemat dla algebr Liego"
