    year: 2010
    precision: year
    type: mathematical_essay
ideas:
  - name: "Dowód fundamentalnego lematu"
    original_name: "Proof of the fundamental lemma"
    wikipedia: "https://en.wikipedia.org/wiki/Fundamental_lemma_(Langlands_program)"
    summary: "Ngô przełożył trudną tożsamość orbitalnych całek na geometrię fibracji Hitchina i użył narzędzi kohomologicznych do jej udowodnienia."
    summary_original: "Ngô translated a difficult identity of orbital integrals into the geometry of the Hitchin fibration and proved it using cohomological methods."
  - name: "Geometria w programie Langlandsa"
    original_name: "Geometry in the Langlands program"
    summary: "Jego praca pokazała siłę metod geometrii algebraicznej w problemach wcześniej formułowanych głównie językiem analizy i reprezentacji."
    summary_original: "His work demonstrated the power of algebraic geometry in problems previously framed largely in analytic and representation-theoretic language."
