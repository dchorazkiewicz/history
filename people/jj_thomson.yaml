image: null
summary: "Brytyjski fizyk, odkrywca elektronu i wieloletni dyrektor Cavendish Laboratory. Wykazał, że promienie katodowe są strumieniem ujemnie naładowanych cząstek o masie znacznie mniejszej od atomu, podważając przekonanie o niepodzielności atomu."
summary_original: "British physicist, discoverer of the electron and long-time director of the Cavendish Laboratory. He showed that cathode rays are streams of negatively charged particles far lighter than atoms, overturning the idea of atomic indivisibility."
