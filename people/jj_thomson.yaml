  - name: "Odkrycie elektronu"
    original_name: "Discovery of the electron"
    wikipedia: "https://en.wikipedia.org/wiki/Electron"
    summary: "Thomson zmierzył stosunek ładunku do masy składników promieni katodowych i wykazał, że są wspólnymi składnikami materii."
    summary_original: "Thomson measured the charge-to-mass ratio of cathode-ray particles and showed that they are universal constituents of matter."
  - name: "Model atomu Thomsona"
    original_name: "Plum pudding model"
    wikipedia: "https://en.wikipedia.org/wiki/Plum_pudding_model"
    summary: "Proponował atom jako dodatnio naładowaną objętość zawierającą ujemne elektrony."
    summary_original: "He proposed the atom as a positively charged volume containing negative electrons."
  - name: "Wczesna spektrometria mas"
    original_name: "Early mass spectrometry"
    summary: "Badania promieni dodatnich doprowadziły Thomsona do rozróżniania jonów o różnych stosunkach masy do ładunku i obserwacji izotopów neonu."
    summary_original: "Positive-ray studies led Thomson to separate ions by mass-to-charge ratio and observe neon isotopes."
