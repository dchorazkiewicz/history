ideas:
  - name: "Logika sylogistyczna"
    original_name: "Syllogistic logic"
    summary: "Systematyczna teoria wnioskowania dedukcyjnego rozwinięta w pismach później zebranych pod nazwą Organon."
    summary_original: "A systematic theory of deductive inference developed in works later grouped as the Organon."
