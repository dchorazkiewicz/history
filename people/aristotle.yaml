    original_name: "Four causes"
    summary: "Wyjaśnienie rzeczy przez przyczynę materialną, formalną, sprawczą i celową."
    summary_original: "Explanation in terms of material, formal, efficient and final causes."
  - name: "Hylemorfizm"
    original_name: "Hylomorphism"
    summary: "Substancje fizyczne rozumiane są poprzez nierozdzielne zasady materii i formy."
    summary_original: "Physical substances are understood through the inseparable principles of matter and form."
