summary: "Matematyk urodzony w Imperium Rosyjskim i działający w Niemczech oraz Szwajcarii. Stworzył geometrię liczb, rozwijał geometrię wypukłą i w 1907–1908 r. nadał szczególnej teorii względności czterowymiarową interpretację czasoprzestrzenną."
summary_original: "Mathematician born in the Russian Empire and active in Germany and Switzerland. He created the geometry of numbers, advanced convex geometry, and in 1907–1908 gave special relativity a four-dimensional spacetime interpretation."
