    summary: "Na zaproszenie Hilberta objął katedrę w Getyndze, gdzie później rozwinął geometryczne ujęcie względności."
    summary_original: "At Hilbert's invitation he took a chair at Göttingen, where he later developed the geometric formulation of relativity."
  - year: 1908
    precision: year
    title: "Wykład „Przestrzeń i czas”"
    original_title: "Space and Time lecture"
    summary: "Minkowski przedstawił geometryczną interpretację teorii względności w słynnym wykładzie w Kolonii."
    summary_original: "Minkowski presented the geometric interpretation of relativity in his famous Cologne lecture."
