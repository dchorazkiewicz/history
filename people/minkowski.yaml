ideas:
  - name: "Geometria liczb"
    original_name: "Geometry of numbers"
    summary: "Minkowski badał problemy teorii liczb przez geometrię wypukłych obszarów i punktów kratowych."
    summary_original: "Minkowski studied number-theoretic problems through convex geometry and lattice points."
  - name: "Twierdzenie Minkowskiego o punktach kratowych"
    original_name: "Minkowski's convex body theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Minkowski%27s_theorem"
    summary: "Odpowiednio duży symetryczny wypukły zbiór zawiera niezerowy punkt kratowy, co łączy objętość geometryczną z arytmetyką."
    summary_original: "A sufficiently large symmetric convex body contains a nonzero lattice point, linking geometric volume with arithmetic."
  - name: "Czasoprzestrzeń Minkowskiego"
    original_name: "Minkowski spacetime"
    wikipedia: "https://en.wikipedia.org/wiki/Minkowski_space"
    summary: "Połączył trzy wymiary przestrzeni i czas w czterowymiarową strukturę geometryczną, która stała się naturalnym językiem szczególnej teorii względności."
    summary_original: "He combined three spatial dimensions and time into a four-dimensional geometric structure that became the natural language of special relativity."
