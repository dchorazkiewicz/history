summary: "Anglo-irlandzki przyrodnik, jedna z kluczowych postaci rewolucji naukowej. Badał własności powietrza i próżni, współtworzył nowoczesne podejście eksperymentalne w chemii i fizyce oraz krytykował tradycyjną teorię czterech żywiołów."
summary_original: "Anglo-Irish natural philosopher and a key figure of the Scientific Revolution. He investigated air and vacuum, helped shape experimental approaches in chemistry and physics, and criticized the traditional theory of four elements."
