    summary: "Dla stałej temperatury ciśnienie gazu jest odwrotnie proporcjonalne do jego objętości."
    summary_original: "At constant temperature, the pressure of a gas varies inversely with its volume."
  - name: "Korpuskularna filozofia materii"
    original_name: "Corpuscular philosophy"
    summary: "Boyle interpretował własności substancji przez ruch i konfigurację drobnych cząstek, odchodząc od arystotelesowskich jakości."
    summary_original: "Boyle interpreted material properties through the motion and configuration of small particles rather than Aristotelian qualities."
  - name: "Eksperyment jako narzędzie wiedzy"
    original_name: "Experiment as a tool of knowledge"
    summary: "Boyle podkreślał powtarzalne doświadczenie, szczegółowy opis aparatury i ostrożne wnioskowanie zamiast systemów spekulatywnych."
    summary_original: "Boyle emphasized repeatable experiments, detailed apparatus descriptions and cautious inference over speculative systems."
