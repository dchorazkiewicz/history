id: wiles
name: "Andrew John Wiles"
display_name: "Andrew Wiles"
born:
  date: "1953-04-11"
  year: 1953
  precision: day
died: null
place_association: "Cambridge; Princeton; Oksford"
fields: [mathematics, number_theory, elliptic_curves, modular_forms, galois_representations, iwasawa_theory]
image: null
summary: "Brytyjski matematyk, który udowodnił wielkie twierdzenie Fermata przez wykazanie kluczowego przypadku hipotezy modularności dla półstabilnych krzywych eliptycznych. Jego praca połączyła teorię liczb, formy modularne i reprezentacje Galois."
summary_original: "British mathematician who proved Fermat's Last Theorem by establishing a key case of the modularity conjecture for semistable elliptic curves. His work connected number theory, modular forms and Galois representations."
works:
  - title: "Modularne krzywe eliptyczne i wielkie twierdzenie Fermata"
