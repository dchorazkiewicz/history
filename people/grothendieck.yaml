    summary: "Grothendieck uogólnił pojęcie rozmaitości algebraicznej tak, aby geometria mogła działać nad bardzo ogólnymi pierścieniami."
    summary_original: "Grothendieck generalized algebraic varieties so geometry could be developed over very general rings."
  - name: "Toposy"
    original_name: "Topos theory"
    wikipedia: "https://en.wikipedia.org/wiki/Topos"
    summary: "Topos miał uogólniać pojęcie przestrzeni i jednocześnie stanowić środowisko dla logiki oraz teorii snopów."
    summary_original: "A topos generalized the notion of space while also serving as a setting for logic and sheaf theory."
  - name: "Motywy"
    original_name: "Motives"
    summary: "Grothendieck zaproponował ideę wspólnego, głębszego obiektu stojącego za różnymi teoriami kohomologii geometrii algebraicznej."
    summary_original: "Grothendieck proposed a common deeper object underlying different cohomology theories in algebraic geometry."
