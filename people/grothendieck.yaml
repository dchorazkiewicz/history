summary: "Francuski matematyk pochodzenia niemieckiego, który radykalnie przebudował geometrię algebraiczną. Wprowadził język schematów, rozwijał teorię kategorii, toposów i kohomologii, a jego program ukształtował ogromną część matematyki drugiej połowy XX wieku."
summary_original: "French mathematician of German origin who radically rebuilt algebraic geometry. He introduced the language of schemes, developed categories, topoi and cohomology, and his program shaped a vast part of second-half twentieth-century mathematics."
