summary: "Brytyjski fizyk i chemik znany z niezwykle precyzyjnych eksperymentów. Zidentyfikował wodór jako odrębny gaz, badał skład atmosfery i elektryczność oraz w eksperymencie skrętnym wyznaczył średnią gęstość Ziemi, co później umożliwiło obliczenie stałej grawitacji."
summary_original: "British physicist and chemist known for exceptionally precise experiments. He identified hydrogen as a distinct gas, studied atmospheric composition and electricity, and used a torsion experiment to determine Earth's mean density, later enabling calculation of the gravitational constant."
