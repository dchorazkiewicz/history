ideas:
  - name: "Wodór jako odrębny gaz"
    original_name: "Hydrogen as a distinct gas"
    summary: "Cavendish badał „palne powietrze”, określił jego własności i wykazał, że podczas spalania z tlenem powstaje woda."
    summary_original: "Cavendish investigated 'inflammable air,' determined its properties and showed that burning it with oxygen produces water."
  - name: "Eksperyment Cavendisha"
    original_name: "Cavendish experiment"
    summary: "Za pomocą wagi skręceń zmierzył bardzo słabe przyciąganie między masami laboratoryjnymi i wyznaczył średnią gęstość Ziemi."
    summary_original: "Using a torsion balance he measured the tiny attraction between laboratory masses and determined Earth's mean density."
  - name: "Wczesna ilościowa elektrostatyka"
    original_name: "Early quantitative electrostatics"
    summary: "Cavendish prowadził bardzo dokładne badania pojemności i zależności siły elektrycznej od odległości, choć wiele wyników opublikowano dopiero pośmiertnie."
    summary_original: "Cavendish made precise studies of capacitance and the distance dependence of electric force, though much was published only posthumously."
