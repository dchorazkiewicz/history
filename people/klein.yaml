ideas:
  - name: "Program erlangeński"
    original_name: "Erlangen Program"
    summary: "Geometrię można klasyfikować według grupy przekształceń, względem których jej własności pozostają niezmienne."
    summary_original: "A geometry can be classified by the group of transformations under which its properties remain invariant."
  - name: "Butelka Kleina"
    original_name: "Klein bottle"
    wikipedia: "https://en.wikipedia.org/wiki/Klein_bottle"
    summary: "Nieorientowalna powierzchnia zamknięta stała się jednym z najbardziej rozpoznawalnych obiektów topologii."
    summary_original: "A closed nonorientable surface became one of topology's most recognizable objects."
  - name: "Integracja matematyki i fizyki w Getyndze"
    original_name: "Integration of mathematics and physics at Göttingen"
    summary: "Klein aktywnie rozwijał współpracę między matematyką, mechaniką, fizyką i inżynierią oraz modernizował kształcenie matematyczne."
    summary_original: "Klein actively fostered collaboration among mathematics, mechanics, physics and engineering while modernizing mathematical education."
