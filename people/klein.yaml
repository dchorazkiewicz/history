summary: "Niemiecki matematyk i reformator nauczania. Program erlangeński uporządkował geometrie według grup przekształceń, łącząc geometrię z teorią grup, a jego działalność w Getyndze pomogła stworzyć jeden z najważniejszych ośrodków matematyki i fizyki przełomu XIX i XX wieku."
summary_original: "German mathematician and educational reformer. The Erlangen Program organized geometries by transformation groups, linking geometry with group theory, while his work at Göttingen helped build one of the world's leading centers of mathematics and physics around 1900."
