    year: 1894
    precision: year
    type: scientific_treatise
ideas:
  - name: "Piezoelektryczność"
    original_name: "Piezoelectricity"
    wikipedia: "https://en.wikipedia.org/wiki/Piezoelectricity"
    summary: "Pierre i Jacques Curie odkryli, że ściskanie niektórych kryształów wytwarza ładunek elektryczny."
    summary_original: "Pierre and Jacques Curie discovered that compressing certain crystals produces electric charge."
  - name: "Prawo Curie"
    original_name: "Curie's law"
    wikipedia: "https://en.wikipedia.org/wiki/Curie%27s_law"
    summary: "Podatność paramagnetyka jest w przybliżeniu odwrotnie proporcjonalna do temperatury bezwzględnej."
    summary_original: "The susceptibility of a paramagnet is approximately inversely proportional to absolute temperature."
  - name: "Temperatura Curie"
    original_name: "Curie temperature"
    summary: "Powyżej charakterystycznej temperatury materiały ferromagnetyczne tracą spontaniczne uporządkowanie magnetyczne."
    summary_original: "Above a characteristic temperature ferromagnetic materials lose spontaneous magnetic order."
  - name: "Badania promieniotwórczości"
    original_name: "Radioactivity research"
    summary: "Wspólnie z Marią Curie opracowywał pomiary promieniotwórczości i badał własności nowo odkrytych pierwiastków."
    summary_original: "With Marie Curie he developed radioactivity measurements and studied properties of newly discovered elements."
