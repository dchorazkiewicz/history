    title: "Nagroda Nobla w dziedzinie fizyki"
    original_title: "Nobel Prize in Physics"
    summary: "Pierre i Maria Curie podzielili połowę nagrody za wspólne badania nad zjawiskami promieniowania."
    summary_original: "Pierre and Marie Curie shared half the prize for their joint research on radiation phenomena."
