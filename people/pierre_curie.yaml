image: null
summary: "Francuski fizyk, badacz magnetyzmu, kryształów i promieniotwórczości. Wspólnie z bratem Jacques’em odkrył piezoelektryczność, sformułował prawo Curie dla paramagnetyków, a z Marią Skłodowską-Curie odkrył polon i rad."
summary_original: "French physicist who studied magnetism, crystals and radioactivity. With his brother Jacques he discovered piezoelectricity, formulated Curie's law for paramagnets, and with Marie Curie discovered polonium and radium."
works:
  - title: "O symetrii w zjawiskach fizycznych"
