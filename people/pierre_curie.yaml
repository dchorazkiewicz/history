    summary: "Pierre i Jacques Curie odkryli efekt piezoelektryczny w kryształach."
    summary_original: "Pierre and Jacques Curie discovered the piezoelectric effect in crystals."
  - year: 1898
    precision: year
    title: "Odkrycie polonu i radu z Marią Curie"
