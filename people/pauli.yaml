    year: 1925
    precision: year
    type: scientific_treatise
ideas:
  - name: "Zasada wykluczania Pauliego"
    original_name: "Pauli exclusion principle"
    wikipedia: "https://en.wikipedia.org/wiki/Pauli_exclusion_principle"
    summary: "Dwa identyczne fermiony nie mogą zajmować tego samego stanu kwantowego."
    summary_original: "No two identical fermions can occupy the same quantum state."
  - name: "Przewidzenie neutrina"
    original_name: "Neutrino hypothesis"
    summary: "Aby zachować energię, pęd i moment pędu w rozpadzie beta, Pauli zaproponował istnienie lekkiej neutralnej cząstki."
    summary_original: "To preserve energy, momentum and angular momentum in beta decay, Pauli proposed a light neutral particle."
  - name: "Macierze Pauliego"
    original_name: "Pauli matrices"
    summary: "Macierze 2×2 opisują spin 1/2 i stały się podstawowym narzędziem mechaniki kwantowej."
    summary_original: "The 2x2 matrices describe spin one-half and became basic tools in quantum mechanics."
