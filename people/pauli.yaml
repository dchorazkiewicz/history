image: null
summary: "Austriacko-szwajcarski fizyk teoretyczny, autor zasady wykluczania i jeden z głównych architektów mechaniki kwantowej. Przewidział istnienie neutrina i wniósł fundamentalny wkład do teorii spinu oraz kwantowej teorii pola."
summary_original: "Austrian-Swiss theoretical physicist, author of the exclusion principle and a major architect of quantum mechanics. He predicted the neutrino and made fundamental contributions to spin theory and quantum field theory."
