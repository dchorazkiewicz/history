summary: "Rosyjski matematyk, który mimo utraty wzroku jako nastolatek stał się jednym z najważniejszych topologów i twórców matematycznej teorii sterowania. Jego nazwisko noszą dualność Pontriagina, klasy charakterystyczne i zasada maksimum."
summary_original: "Russian mathematician who, despite losing his sight as a teenager, became a major topologist and creator of mathematical control theory. His name is attached to Pontryagin duality, characteristic classes and the maximum principle."
