ideas:
  - name: "Dualność Pontriagina"
    original_name: "Pontryagin duality"
    wikipedia: "https://en.wikipedia.org/wiki/Pontryagin_duality"
    summary: "Lokalnie zwarte abelowe grupy można odtworzyć z grupy ich ciągłych charakterów."
    summary_original: "Locally compact abelian groups can be recovered from the group of their continuous characters."
  - name: "Klasy Pontriagina"
    original_name: "Pontryagin classes"
    summary: "Charakterystyczne klasy wiązek rzeczywistych stały się ważnym narzędziem topologii różniczkowej."
    summary_original: "Characteristic classes of real vector bundles became an important tool of differential topology."
  - name: "Zasada maksimum Pontriagina"
    original_name: "Pontryagin maximum principle"
    wikipedia: "https://en.wikipedia.org/wiki/Pontryagin%27s_maximum_principle"
    summary: "Podstawowa zasada teorii sterowania optymalnego daje warunki konieczne dla optymalnych trajektorii systemów dynamicznych."
    summary_original: "A foundational principle of optimal control gives necessary conditions for optimal trajectories of dynamical systems."
