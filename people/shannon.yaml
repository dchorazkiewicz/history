    summary: "Shannon pokazał praktyczne znaczenie algebry Boole’a dla konstrukcji układów elektrycznych."
    summary_original: "Shannon demonstrated the practical significance of Boolean algebra for electrical circuit design."
  - year: 1948
    precision: year
    title: "Narodziny teorii informacji"
    original_title: "Birth of information theory"
    summary: "Publikacja A Mathematical Theory of Communication stworzyła wspólny język dla telekomunikacji, kodowania i przetwarzania informacji."
    summary_original: "Publication of A Mathematical Theory of Communication created a common language for telecommunications, coding and information processing."
