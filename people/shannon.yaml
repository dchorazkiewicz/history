image: null
summary: "Amerykański matematyk i inżynier, twórca teorii informacji. W młodości pokazał, że algebra Boole’a może opisywać obwody przełączające, a w 1948 r. zdefiniował matematyczną miarę informacji i granice niezawodnej komunikacji."
summary_original: "American mathematician and engineer, creator of information theory. As a young researcher he showed that Boolean algebra could describe switching circuits, and in 1948 he defined a mathematical measure of information and limits of reliable communication."
