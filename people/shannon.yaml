ideas:
  - name: "Entropia Shannona"
    original_name: "Shannon entropy"
    wikipedia: "https://en.wikipedia.org/wiki/Entropy_(information_theory)"
    summary: "Shannon zdefiniował ilość informacji przez funkcję mierzącą niepewność rozkładu prawdopodobieństwa."
    summary_original: "Shannon defined information quantity through a function measuring uncertainty in a probability distribution."
  - name: "Pojemność kanału"
    original_name: "Channel capacity"
    summary: "Udowodnił, że dla kanału komunikacyjnego istnieje graniczna szybkość transmisji, poniżej której można dowolnie zmniejszać prawdopodobieństwo błędu."
    summary_original: "He proved that a communication channel has a limiting transmission rate below which error probability can be made arbitrarily small."
  - name: "Algebra Boole’a w obwodach cyfrowych"
    original_name: "Boolean algebra in digital circuits"
    summary: "Praca magisterska Shannona połączyła logikę Boole’a z projektowaniem sieci przekaźnikowych i stała się fundamentem układów cyfrowych."
    summary_original: "Shannon's master's thesis connected Boolean logic with relay-network design and became foundational to digital circuits."
events:
