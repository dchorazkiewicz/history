ideas:
  - name: "Hipotezy Weila"
    original_name: "Weil conjectures"
    wikipedia: "https://en.wikipedia.org/wiki/Weil_conjectures"
    summary: "Weil sformułował głębokie przewidywania dotyczące liczby punktów rozmaitości algebraicznych nad ciałami skończonymi, łącząc geometrię, topologię i teorię liczb."
    summary_original: "Weil formulated deep predictions about numbers of points of algebraic varieties over finite fields, linking geometry, topology and number theory."
  - name: "Adele i idele w teorii liczb"
    original_name: "Adeles and ideles"
    summary: "Rozwinął globalny język pozwalający traktować równocześnie wszystkie lokalne dopełnienia ciała liczbowego."
    summary_original: "He developed a global language allowing all local completions of a number field to be handled simultaneously."
  - name: "Bourbaki"
    original_name: "Nicolas Bourbaki"
    wikipedia: "https://en.wikipedia.org/wiki/Nicolas_Bourbaki"
    summary: "Weil należał do założycieli kolektywu Bourbaki, który próbował przebudować matematykę na jednolitym, strukturalnym i aksjomatycznym języku."
    summary_original: "Weil was among the founders of Bourbaki, which sought to rebuild mathematics in a unified structural and axiomatic language."
