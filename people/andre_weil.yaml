summary: "Francuski matematyk, jedna z centralnych postaci matematyki XX wieku i współzałożyciel grupy Bourbaki. Połączył teorię liczb z geometrią algebraiczną, sformułował słynne hipotezy Weila i wpłynął na język całych pokoleń matematyków."
summary_original: "French mathematician, one of the central figures of twentieth-century mathematics and a co-founder of Bourbaki. He connected number theory with algebraic geometry, formulated the Weil conjectures and influenced the language of generations of mathematicians."
