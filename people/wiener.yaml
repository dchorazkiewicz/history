summary: "Amerykański matematyk, twórca cybernetyki. Łączył teorię prawdopodobieństwa, procesy losowe, analizę harmoniczną, sterowanie i komunikację, a jego idee o sprzężeniu zwrotnym stały się jednym z podstawowych języków współczesnej automatyki i teorii systemów."
summary_original: "American mathematician and founder of cybernetics. He connected probability, stochastic processes, harmonic analysis, control and communication, and his ideas on feedback became a basic language of modern automation and systems theory."
