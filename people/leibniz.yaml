ideas:
  - name: "Rachunek różniczkowy i całkowy"
    original_name: "Differential and integral calculus"
    summary: "Leibniz rozwinął go niezależnie od Newtona, a jego zapis stał się podstawą współczesnej notacji rachunku różniczkowego i całkowego."
    summary_original: "Developed independently of Newton, with notation that became foundational for modern calculus."
  - name: "Monady"
    original_name: "Monads"
    summary: "Proste substancje metafizyczne mające wyjaśniać jedność, postrzeganie i zmianę."
    summary_original: "Metaphysical simple substances used to account for unity, perception and change."
  - name: "Zasada racji dostatecznej"
    original_name: "Principle of sufficient reason"
    summary: "Nic nie jest takie, jakie jest, bez dostatecznej racji wyjaśniającej, dlaczego jest właśnie tak, a nie inaczej."
    summary_original: "Nothing is the case without a sufficient reason why it is so rather than otherwise."
  - name: "Arytmetyka binarna"
    original_name: "Binary arithmetic"
    summary: "Leibniz rozwijał i popularyzował system dwójkowy oraz dostrzegał jego znaczenie pojęciowe."
    summary_original: "Developed and promoted a systematic binary numeral system and its conceptual significance."
