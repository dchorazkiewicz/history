summary: "Niemiecki uczony, który niezależnie od Newtona rozwinął rachunek różniczkowy i całkowy oraz wniósł ważny wkład do logiki, metafizyki i idei obliczeń."
summary_original: "German polymath who independently developed differential and integral calculus and made major contributions to logic, metaphysics and computation."
