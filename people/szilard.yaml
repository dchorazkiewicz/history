summary: "Węgiersko-amerykański fizyk i wynalazca. W 1933 r. sformułował ideę neutronowej reakcji łańcuchowej, współtworzył koncepcję reaktora jądrowego, pracował przy Projekcie Manhattan, a później zaangażował się w kontrolę zbrojeń i biologię molekularną."
summary_original: "Hungarian-American physicist and inventor. In 1933 he conceived the neutron chain reaction, helped develop the nuclear reactor concept, worked on the Manhattan Project, and later became active in arms control and molecular biology."
