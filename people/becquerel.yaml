image: null
summary: "Francuski fizyk, odkrywca naturalnej promieniotwórczości. Badając sole uranu w 1896 r. zauważył, że samorzutnie zaczerniają płytę fotograficzną nawet bez wcześniejszego naświetlenia."
summary_original: "French physicist who discovered natural radioactivity. While studying uranium salts in 1896 he found that they spontaneously fogged photographic plates even without prior exposure to light."
