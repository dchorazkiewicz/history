    summary: "Becquerel wykazał, że związki uranu emitują przenikliwe promieniowanie samorzutnie, bez zewnętrznego wzbudzenia świetlnego."
    summary_original: "Becquerel showed that uranium compounds emit penetrating radiation spontaneously, without external light excitation."
  - name: "Promienie Becquerela"
    original_name: "Becquerel rays"
    summary: "Pierwsza nazwa promieniowania pochodzącego od uranu stała się punktem wyjścia do badań Curie nad promieniotwórczością."
    summary_original: "The early name for radiation from uranium became the starting point for the Curies' research on radioactivity."
