  - title: "Traktat o równowadze i ruchu cieczy"
    original_title: "Traité de l'équilibre et du mouvement des fluides"
    year: 1744
    precision: year
    type: scientific_treatise
  - title: "Badania nad krzywą tworzoną przez drgającą strunę"
