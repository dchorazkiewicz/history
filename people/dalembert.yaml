ideas:
  - name: "Zasada d’Alemberta"
    original_name: "D'Alembert's principle"
    wikipedia: "https://en.wikipedia.org/wiki/D%27Alembert%27s_principle"
    summary: "D’Alembert przekształcił problem ruchu w formalnie równoważny problem równowagi przez uwzględnienie sił bezwładności."
    summary_original: "D'Alembert reformulated a problem of motion as an equivalent problem of equilibrium by introducing inertial forces."
  - name: "Równanie falowe"
    original_name: "Wave equation"
    wikipedia: "https://en.wikipedia.org/wiki/Wave_equation"
    summary: "W badaniu drgającej struny sformułował jedno z pierwszych równań różniczkowych cząstkowych opisujących propagację fal."
    summary_original: "In studying the vibrating string he formulated one of the first partial differential equations describing wave propagation."
  - name: "Paradoks d’Alemberta"
    original_name: "D'Alembert's paradox"
    wikipedia: "https://en.wikipedia.org/wiki/D%27Alembert%27s_paradox"
    summary: "W idealizowanym przepływie płynu bez lepkości otrzymywał zerowy opór ciała, wynik sprzeczny z codziennym doświadczeniem i ważny dla rozwoju mechaniki płynów."
    summary_original: "In ideal inviscid flow he obtained zero drag on a body, a result contrary to everyday experience and important in the development of fluid mechanics."
  - name: "Projekt Encyklopedii"
    original_name: "The Encyclopédie project"
    summary: "Wraz z Diderotem redagował Encyklopedię i próbował uporządkować mapę ludzkiej wiedzy zgodnie z ideałami Oświecenia."
    summary_original: "With Diderot he edited the Encyclopédie and sought to organize the map of human knowledge according to Enlightenment ideals."
events:
  - year: 1741
    precision: year
    title: "Wybór do Académie des Sciences"
    original_title: "Election to the Académie des Sciences"
    summary: "D’Alembert wszedł do czołowego francuskiego środowiska naukowego."
    summary_original: "D'Alembert entered France's leading scientific institution."
  - year: 1751
    precision: year
    title: "Pierwszy tom Encyklopedii"
    original_title: "First volume of the Encyclopédie"
    summary: "Ukazał się pierwszy tom wielkiego przedsięwzięcia redagowanego przez Diderota i d’Alemberta."
    summary_original: "The first volume of the great project edited by Diderot and d'Alembert appeared."
