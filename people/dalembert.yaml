image: null
summary: "Francuski matematyk, fizyk, filozof i współredaktor Encyklopedii. Rozwijał równania różniczkowe cząstkowe, teorię drgań, dynamikę i mechanikę płynów, a równocześnie należał do centralnych postaci francuskiego Oświecenia."
summary_original: "French mathematician, physicist, philosopher and co-editor of the Encyclopédie. He advanced partial differential equations, vibration theory, dynamics and fluid mechanics, while also becoming a central figure of the French Enlightenment."
