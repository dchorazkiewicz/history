summary: "Niemiecki matematyk, który połączył geometrię algebraiczną, topologię i klasy charakterystyczne. Jego twierdzenie Riemanna-Rocha było kluczowym krokiem prowadzącym do późniejszych uogólnień Grothendiecka i Atiyaha-Singera."
summary_original: "German mathematician who connected algebraic geometry, topology and characteristic classes. His Riemann–Roch theorem was a key step toward later generalizations by Grothendieck and Atiyah–Singer."
