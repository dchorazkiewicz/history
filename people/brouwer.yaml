image: null
summary: "Holenderski matematyk i filozof matematyki. Był jednym z twórców nowoczesnej topologii oraz założycielem intuicjonizmu, nurtu kwestionującego część klasycznej logiki w odniesieniu do nieskończonych obiektów matematycznych."
summary_original: "Dutch mathematician and philosopher of mathematics. He was a founder of modern topology and of intuitionism, a foundational program questioning parts of classical logic when applied to infinite mathematical objects."
works:
  - title: "O podstawach matematyki"
    original_title: "Over de Grondslagen der Wiskunde"
    year: 1907
    precision: year
    type: philosophy
ideas:
  - name: "Twierdzenie Brouwera o punkcie stałym"
    original_name: "Brouwer fixed-point theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Brouwer_fixed-point_theorem"
    summary: "Każde ciągłe przekształcenie pełnej kuli w nią samą ma punkt stały."
    summary_original: "Every continuous map from a closed ball to itself has a fixed point."
  - name: "Niezmienniczość dziedziny"
    original_name: "Invariance of domain"
    summary: "Ciągłe i różnowartościowe odwzorowanie otwartego obszaru przestrzeni euklidesowej zachowuje lokalny wymiar i otwartość obrazu."
    summary_original: "A continuous injective map of an open Euclidean region preserves local dimension and has open image."
  - name: "Intuicjonizm"
    original_name: "Intuitionism"
    wikipedia: "https://en.wikipedia.org/wiki/Intuitionism"
    summary: "Brouwer uważał matematykę za działalność konstrukcyjną umysłu i odrzucał bezwarunkowe używanie prawa wyłączonego środka w nieskończonych kontekstach."
    summary_original: "Brouwer viewed mathematics as a constructive mental activity and rejected unrestricted use of excluded middle in infinite contexts."
