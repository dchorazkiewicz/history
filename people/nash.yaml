summary: "Amerykański matematyk, którego prace zmieniły teorię gier, geometrię różniczkową i teorię równań różniczkowych cząstkowych. Pojęcie równowagi Nasha stało się podstawą nowoczesnej mikroekonomii i nauk o strategii."
summary_original: "American mathematician whose work transformed game theory, differential geometry and partial differential equations. The Nash equilibrium became foundational to modern microeconomics and strategic science."
