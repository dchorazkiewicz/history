    original_title: "Nobel Memorial Prize in Economic Sciences"
    summary: "Nash został współlaureatem za pionierską analizę równowag w teorii gier niekooperacyjnych."
    summary_original: "Nash shared the prize for pioneering analysis of equilibria in non-cooperative games."
  - year: 2015
