    summary: "Wspólnie z Louisem Nirenbergiem otrzymał Nagrodę Abela za wkład do nieliniowych równań różniczkowych cząstkowych i geometrii."
    summary_original: "With Louis Nirenberg he received the Abel Prize for contributions to nonlinear partial differential equations and geometric analysis."
