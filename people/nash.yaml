ideas:
  - name: "Równowaga Nasha"
    original_name: "Nash equilibrium"
    wikipedia: "https://en.wikipedia.org/wiki/Nash_equilibrium"
    summary: "Profil strategii jest równowagą, gdy żaden gracz nie może jednostronnie poprawić swojego wyniku."
    summary_original: "A strategy profile is an equilibrium when no player can improve their outcome by deviating unilaterally."
  - name: "Twierdzenie Nasha o zanurzeniu"
    original_name: "Nash embedding theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Nash_embedding_theorem"
    summary: "Każdą rozmaitość riemannowską można izometrycznie zanurzyć w odpowiednio wysokowymiarowej przestrzeni euklidesowej."
    summary_original: "Every Riemannian manifold can be isometrically embedded in a sufficiently high-dimensional Euclidean space."
  - name: "Regularność równań eliptycznych"
    original_name: "De Giorgi–Nash theorem"
    summary: "Nash niezależnie uzyskał kluczowe wyniki o regularności rozwiązań eliptycznych równań różniczkowych."
    summary_original: "Nash independently obtained key regularity results for elliptic partial differential equations."
