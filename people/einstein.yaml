image: null
summary: "Niemiecko-amerykański fizyk teoretyczny, jeden z głównych twórców fizyki XX wieku. Sformułował szczególną i ogólną teorię względności, wyjaśnił efekt fotoelektryczny za pomocą kwantów światła, rozwinął teorię ruchów Browna i wniósł fundamentalny wkład do statystycznych podstaw mechaniki kwantowej."
summary_original: "German-born American theoretical physicist and one of the principal creators of twentieth-century physics. He formulated special and general relativity, explained the photoelectric effect using light quanta, developed the theory of Brownian motion and made fundamental contributions to the statistical foundations of quantum theory."
