    wikipedia: "https://en.wikipedia.org/wiki/On_the_Electrodynamics_of_Moving_Bodies"
    year: 1905
    precision: year
    type: scientific_treatise
  - title: "Czy bezwładność ciała zależy od zawartej w nim energii?"
