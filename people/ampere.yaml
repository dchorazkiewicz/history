    summary: "W ciągu kilku tygodni Ampère rozpoczął intensywne doświadczenia i matematyzację nowych zjawisk elektromagnetycznych."
    summary_original: "Within weeks Ampère began intensive experiments and mathematical analysis of the new electromagnetic phenomena."
