summary: "Francuski fizyk i matematyk, jeden z głównych twórców elektrodynamiki. Bezpośrednio po odkryciu Ørsteda rozpoczął systematyczne badania sił między przewodnikami z prądem i sformułował prawa matematyczne łączące elektryczność z magnetyzmem."
summary_original: "French physicist and mathematician, a principal creator of electrodynamics. Immediately after Ørsted's discovery he systematically investigated forces between current-carrying conductors and formulated mathematical laws linking electricity and magnetism."
