    summary: "Ampère powiązał pole magnetyczne wokół przewodnika z przepływającym prądem."
    summary_original: "Ampère related the magnetic field around a conductor to the electric current flowing through it."
  - name: "Siła między przewodnikami z prądem"
    original_name: "Force between current-carrying wires"
    summary: "Pokazał, że równoległe przewodniki mogą się przyciągać lub odpychać zależnie od kierunków prądów."
    summary_original: "He showed that parallel current-carrying wires attract or repel depending on current direction."
  - name: "Elektrodynamika"
    original_name: "Electrodynamics"
    summary: "Ampère stworzył jedną z pierwszych spójnych matematycznych teorii oddziaływań prądów elektrycznych."
    summary_original: "Ampère created one of the first coherent mathematical theories of interactions among electric currents."
