image: null
summary: "Amerykański fizyk teoretyczny, jeden z głównych twórców renormalizowanej elektrodynamiki kwantowej. Rozwinął niezwykle precyzyjny formalizm operatorowy i obliczył poprawkę do momentu magnetycznego elektronu."
summary_original: "American theoretical physicist and a principal creator of renormalized quantum electrodynamics. He developed a highly precise operator formalism and calculated the correction to the electron magnetic moment."
