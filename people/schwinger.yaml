    year: 1948
    precision: year
    type: scientific_treatise
ideas:
  - name: "Renormalizowana QED"
    original_name: "Renormalized quantum electrodynamics"
    summary: "Schwinger stworzył kowariantny formalizm pozwalający uzyskiwać skończone i zgodne z eksperymentem wyniki."
    summary_original: "Schwinger created a covariant formalism yielding finite predictions in agreement with experiment."
  - name: "Anomalny moment magnetyczny elektronu"
    original_name: "Electron anomalous magnetic moment"
    summary: "Obliczył pierwszą poprawkę kwantową do współczynnika g elektronu, jeden z pierwszych spektakularnych sukcesów QED."
    summary_original: "He calculated the first quantum correction to the electron g-factor, an early spectacular success of QED."
  - name: "Formalizm źródeł"
    original_name: "Source theory"
    summary: "W późniejszym okresie Schwinger rozwijał alternatywny formalizm kwantowej teorii pola oparty na źródłach fizycznych."
    summary_original: "Later Schwinger developed an alternative quantum-field framework based on physical sources."
