image: null
summary: "Włosko-amerykański fizyk wyjątkowo skuteczny zarówno w teorii, jak i eksperymencie. Stworzył statystykę Fermiego-Diraca, teorię rozpadu beta, prowadził badania neutronowe i zbudował pierwszy samopodtrzymujący się reaktor jądrowy."
summary_original: "Italian-American physicist exceptionally accomplished in both theory and experiment. He created Fermi–Dirac statistics, developed beta-decay theory, led neutron research and built the first self-sustaining nuclear reactor."
