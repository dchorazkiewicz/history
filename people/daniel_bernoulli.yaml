image: null
summary: "Szwajcarski matematyk i fizyk z rodziny Bernoullich. W Hydrodynamice połączył mechanikę cieczy z zasadą zachowania energii, sformułował relację znaną jako zasada Bernoulliego i należał do pionierów kinetycznego opisu gazów oraz zastosowań probabilistyki do medycyny."
summary_original: "Swiss mathematician and physicist from the Bernoulli family. In Hydrodynamica he connected fluid mechanics with energy conservation, formulated the relation known as Bernoulli's principle, pioneered kinetic ideas about gases, and applied probability to medicine."
works:
  - title: "Hydrodynamika"
    original_title: "Hydrodynamica"
    wikipedia: "https://en.wikipedia.org/wiki/Hydrodynamica"
    year: 1738
    precision: year
    type: scientific_treatise
ideas:
  - name: "Zasada Bernoulliego"
    original_name: "Bernoulli's principle"
    wikipedia: "https://en.wikipedia.org/wiki/Bernoulli%27s_principle"
    summary: "W ustalonym przepływie idealnego płynu wzrost prędkości wiąże się ze spadkiem ciśnienia lub zmianą energii potencjalnej."
    summary_original: "In steady ideal-fluid flow, an increase in speed is associated with a decrease in pressure or a change in potential energy."
  - name: "Kinetyczny model gazu"
    original_name: "Kinetic model of gases"
    summary: "Bernoulli interpretował ciśnienie gazu jako rezultat zderzeń poruszających się cząstek ze ściankami naczynia."
    summary_original: "Bernoulli interpreted gas pressure as the result of moving particles colliding with container walls."
  - name: "Oczekiwana użyteczność"
    original_name: "Expected utility"
    wikipedia: "https://en.wikipedia.org/wiki/St._Petersburg_paradox"
    summary: "Analizując paradoks petersburski rozróżnił wartość pieniężną od subiektywnej użyteczności zysku."
    summary_original: "In analyzing the St Petersburg paradox he distinguished monetary value from subjective utility."
  - name: "Probabilistyka w epidemiologii"
    original_name: "Probability in epidemiology"
    summary: "W pracy o ospie porównywał oczekiwaną długość życia z i bez inokulacji, tworząc wczesny przykład ilościowej analizy ryzyka medycznego."
    summary_original: "In work on smallpox he compared expected lifetimes with and without inoculation, an early quantitative analysis of medical risk."
