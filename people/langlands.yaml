    title: "List do André Weila"
    original_title: "Letter to André Weil"
    summary: "Nieformalny list zawierał zalążek programu, który przez kolejne dekady zorganizował ogromną część teorii liczb i reprezentacji."
    summary_original: "An informal letter contained the seed of a program that organized vast areas of number theory and representation theory for decades."
  - year: 2018
