image: null
summary: "Kanadyjski matematyk, twórca programu Langlandsa — rozległej sieci przewidywań łączących teorię liczb, reprezentacje grup i formy automorficzne. Program ten stał się jednym z głównych organizujących projektów współczesnej matematyki."
summary_original: "Canadian mathematician and creator of the Langlands program, a vast network of conjectures linking number theory, group representations and automorphic forms. The program became one of the major organizing projects of modern mathematics."
works:
  - title: "List do André Weila"
    original_title: "Letter to André Weil"
    year: 1967
    precision: year
    type: manuscript
    publication_note: "Siedemnastostronicowy list naszkicował idee, z których wyrósł program Langlandsa."
    publication_note_original: "A seventeen-page letter sketched the ideas from which the Langlands program grew."
  - title: "Problemy teorii form automorficznych"
    original_title: "Problems in the Theory of Automorphic Forms"
    year: 1970
    precision: year
