    title: "Nagroda Abela"
    original_title: "Abel Prize"
    summary: "Langlands otrzymał Nagrodę Abela za wizjonerski program łączący teorię reprezentacji z teorią liczb."
    summary_original: "Langlands received the Abel Prize for his visionary program connecting representation theory to number theory."
