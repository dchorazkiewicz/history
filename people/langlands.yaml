ideas:
  - name: "Program Langlandsa"
    original_name: "Langlands program"
    wikipedia: "https://en.wikipedia.org/wiki/Langlands_program"
    summary: "Program przewiduje głębokie związki między reprezentacjami grup Galois i automorficznymi reprezentacjami grup reduktywnych."
    summary_original: "The program predicts deep correspondences between Galois representations and automorphic representations of reductive groups."
  - name: "Zasada funktorialności"
    original_name: "Langlands functoriality"
    summary: "Przenoszenie reprezentacji między grupami powinno odpowiadać naturalnym relacjom między ich L-funkcjami i strukturami dualnymi."
    summary_original: "Transfer of representations between groups should correspond to natural relations among their L-functions and dual structures."
  - name: "Uogólniona wzajemność"
    original_name: "Generalized reciprocity"
    summary: "Program Langlandsa rozszerza klasyczne prawa wzajemności teorii liczb na znacznie szersze klasy obiektów."
    summary_original: "The Langlands program generalizes classical reciprocity laws of number theory to much broader classes of objects."
events:
  - year: 1967
