summary: "Australijsko-amerykański matematyk o niezwykle szerokim dorobku, obejmującym analizę harmoniczną, równania różniczkowe, kombinatorykę addytywną, teorię liczb i teorię sygnałów. Wspólnie z Benem Greenem udowodnił, że liczby pierwsze zawierają dowolnie długie ciągi arytmetyczne."
summary_original: "Australian-American mathematician of exceptionally broad scope, spanning harmonic analysis, partial differential equations, additive combinatorics, number theory and signal theory. With Ben Green he proved that the primes contain arbitrarily long arithmetic progressions."
