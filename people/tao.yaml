    summary: "Tao wraz z Emmanuelem Candèsem i innymi stworzył podstawy odzyskiwania rzadkich sygnałów z liczby pomiarów znacznie mniejszej niż sugerowały klasyczne metody."
    summary_original: "With Emmanuel Candès and others, Tao helped establish recovery of sparse signals from far fewer measurements than classical methods suggested."
