    original_name: "Dispersive PDE analysis"
    summary: "Rozwijał nowoczesne techniki dla nieliniowych równań falowych i Schrödingera, łącząc analizę harmoniczną z dynamiką."
    summary_original: "He developed modern techniques for nonlinear wave and Schrödinger equations, linking harmonic analysis with dynamics."
