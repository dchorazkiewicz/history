image: null
summary: "Duński fizyk, jedna z centralnych postaci narodzin mechaniki kwantowej. Stworzył model atomu z kwantowanymi stanami, rozwinął zasadę komplementarności i zbudował w Kopenhadze jeden z najważniejszych ośrodków fizyki XX wieku."
summary_original: "Danish physicist and a central figure in the birth of quantum mechanics. He created a model of the atom with quantized states, developed the principle of complementarity and built one of the twentieth century's leading physics centers in Copenhagen."
works:
  - title: "O budowie atomów i cząsteczek"
    original_title: "On the Constitution of Atoms and Molecules"
    year: 1913
    precision: year
    type: scientific_treatise
ideas:
  - name: "Model Bohra atomu"
    original_name: "Bohr model"
    wikipedia: "https://en.wikipedia.org/wiki/Bohr_model"
    summary: "Elektrony mogą zajmować tylko wybrane stany energetyczne, a przejściom między nimi towarzyszy emisja lub absorpcja kwantów promieniowania."
    summary_original: "Electrons occupy only selected energy states, with radiation emitted or absorbed during transitions between them."
  - name: "Zasada korespondencji"
    original_name: "Correspondence principle"
    summary: "W granicy dużych liczb kwantowych przewidywania teorii kwantowej powinny przechodzić w wyniki fizyki klasycznej."
    summary_original: "At large quantum numbers, quantum predictions should approach classical physics."
  - name: "Komplementarność"
    original_name: "Complementarity"
    wikipedia: "https://en.wikipedia.org/wiki/Complementarity_(physics)"
    summary: "Różne, wzajemnie wykluczające się opisy eksperymentalne mogą być konieczne do pełnego opisu zjawiska kwantowego."
    summary_original: "Different mutually exclusive experimental descriptions may be necessary for a complete account of a quantum phenomenon."
events:
  - year: 1913
