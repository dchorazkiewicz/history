    summary: "Bohr połączył model jądrowy Rutherforda z hipotezą kwantową Plancka."
    summary_original: "Bohr combined Rutherford's nuclear atom with Planck's quantum hypothesis."
  - year: 1922
    precision: year
    title: "Nagroda Nobla w dziedzinie fizyki"
    original_title: "Nobel Prize in Physics"
    summary: "Nagrodzono go za badania struktury atomów i emitowanego przez nie promieniowania."
    summary_original: "He was honored for investigations of atomic structure and radiation."
