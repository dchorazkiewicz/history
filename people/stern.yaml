summary: "Niemiecko-amerykański fizyk eksperymentalny, pionier metod wiązek molekularnych. Eksperyment Sterna-Gerlacha ujawnił kwantowanie orientacji momentu magnetycznego i stał się jednym z klasycznych doświadczeń mechaniki kwantowej."
summary_original: "German-American experimental physicist and pioneer of molecular-beam methods. The Stern–Gerlach experiment revealed space quantization of magnetic moments and became a classic experiment of quantum mechanics."
