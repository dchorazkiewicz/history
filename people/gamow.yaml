summary: "Ukraińsko-amerykański fizyk teoretyczny, który zastosował mechanikę kwantową do rozpadu alfa, rozwijał gorący model Wielkiego Wybuchu i przewidywał kosmiczne promieniowanie tła. Interesował się również problemem kodu genetycznego."
summary_original: "Ukrainian-American theoretical physicist who applied quantum mechanics to alpha decay, developed the hot Big Bang model and predicted relic cosmic radiation. He also explored ideas related to the genetic code."
