    summary: "Gamow wyjaśnił emisję cząstki alfa jako tunelowanie przez barierę potencjału jądrowego."
    summary_original: "Gamow explained alpha emission as quantum tunneling through the nuclear potential barrier."
  - name: "Nukleosynteza Wielkiego Wybuchu"
    original_name: "Big Bang nucleosynthesis"
    summary: "Wraz z Ralphem Alpherem rozwijał teorię powstawania lekkich pierwiastków we wczesnym gorącym Wszechświecie."
    summary_original: "With Ralph Alpher he developed the theory of light-element formation in the early hot universe."
  - name: "Reliktowe promieniowanie tła"
    original_name: "Relic background radiation"
    summary: "Gamow i współpracownicy przewidywali, że gorący początek Wszechświata powinien pozostawić ochłodzone promieniowanie obserwowalne dziś."
    summary_original: "Gamow and collaborators predicted that a hot early universe should leave cooled background radiation observable today."
