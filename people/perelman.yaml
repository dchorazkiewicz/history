    title: "Odmowa przyjęcia Medalu Fieldsa"
    original_title: "Declining the Fields Medal"
    summary: "Perelman nie przyjął Medalu Fieldsa przyznanego za rozwiązanie jednego z najważniejszych problemów topologii."
    summary_original: "Perelman declined the Fields Medal awarded for solving one of topology's central problems."
  - year: 2010
    precision: year
    title: "Odmowa Nagrody Milenijnej"
    original_title: "Declining the Millennium Prize"
    summary: "Odmówił również nagrody miliona dolarów Clay Mathematics Institute."
    summary_original: "He also declined the million-dollar Clay Mathematics Institute prize."
