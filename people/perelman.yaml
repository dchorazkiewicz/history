    original_title: "First preprint in the solution of Hamilton's program"
    summary: "Perelman opublikował pracę w arXiv zamiast w tradycyjnym czasopiśmie."
    summary_original: "Perelman posted his work to arXiv rather than first submitting it to a traditional journal."
  - year: 2006
