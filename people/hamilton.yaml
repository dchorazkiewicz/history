ideas:
  - name: "Mechanika Hamiltona"
    original_name: "Hamiltonian mechanics"
    wikipedia: "https://en.wikipedia.org/wiki/Hamiltonian_mechanics"
    summary: "Hamilton przeformułował mechanikę klasyczną w języku funkcji Hamiltona i równań pierwszego rzędu, tworząc formalizm fundamentalny również dla fizyki XX wieku."
    summary_original: "Hamilton reformulated classical mechanics using the Hamiltonian and first-order equations, creating a formalism fundamental also to twentieth-century physics."
  - name: "Kwaterniony"
    original_name: "Quaternions"
    wikipedia: "https://en.wikipedia.org/wiki/Quaternion"
    summary: "W 1843 r. odkrył czterowymiarowy system liczbowy rozszerzający liczby zespolone, w którym mnożenie nie jest przemienne."
    summary_original: "In 1843 he discovered a four-dimensional number system extending complex numbers, with noncommutative multiplication."
  - name: "Równanie Hamiltona-Jacobiego"
    original_name: "Hamilton–Jacobi equation"
    summary: "Połączenie idei Hamiltona i Jacobiego stworzyło pomost między mechaniką klasyczną, optyką i późniejszą mechaniką kwantową."
    summary_original: "The synthesis of Hamilton's and Jacobi's ideas created a bridge between classical mechanics, optics and later quantum mechanics."
  - name: "Refrakcja stożkowa"
    original_name: "Conical refraction"
    summary: "Hamilton matematycznie przewidział nietypowe rozszczepienie promienia w kryształach dwuosiowych; zjawisko zostało następnie potwierdzone eksperymentalnie."
    summary_original: "Hamilton mathematically predicted unusual ray splitting in biaxial crystals; the phenomenon was then experimentally confirmed."
events:
  - year: 1827
    precision: year
    title: "Królewski astronom Irlandii"
    original_title: "Royal Astronomer of Ireland"
    summary: "Jeszcze jako bardzo młody uczony został profesorem astronomii i dyrektorem obserwatorium Dunsink."
    summary_original: "Still very young, he became professor of astronomy and director of Dunsink Observatory."
  - year: 1832
    precision: year
    title: "Przewidzenie refrakcji stożkowej"
    original_title: "Prediction of conical refraction"
    summary: "Teoretyczny wynik został wkrótce potwierdzony doświadczalnie przez Humphreya Lloyda."
    summary_original: "The theoretical prediction was soon experimentally confirmed by Humphrey Lloyd."
  - year: 1843
    precision: day
    title: "Odkrycie kwaternionów"
    original_title: "Discovery of quaternions"
    summary: "16 października 1843 r. podczas spaceru przy kanale w Dublinie Hamilton zapisał fundamentalne relacje mnożenia kwaternionów."
    summary_original: "On 16 October 1843, while walking beside the canal in Dublin, Hamilton wrote down the fundamental quaternion multiplication relations."
