  year: 1865
  precision: day
place_association: "Dublin; Dunsink Observatory, Irlandia"
fields: [mathematics, algebra, complex_numbers, mechanics, optics, astronomy, physics, poetry]
image: null
summary: "Irlandzki matematyk, astronom i fizyk matematyczny. Stworzył formalizm mechaniki Hamiltona, rozwinął analogię między optyką i dynamiką, przewidział refrakcję stożkową i wynalazł kwaterniony, otwierając drogę do algebry wektorowej i nowych struktur algebraicznych."
summary_original: "Irish mathematician, astronomer and mathematical physicist. He created Hamiltonian mechanics, developed the analogy between optics and dynamics, predicted conical refraction and invented quaternions, opening paths toward vector algebra and new algebraic structures."
works:
  - title: "Teoria układów promieni"
    original_title: "Theory of Systems of Rays"
    year: 1828
    precision: year
    type: scientific_treatise
  - title: "O ogólnej metodzie dynamiki"
    original_title: "On a General Method in Dynamics"
    year: 1834
    precision: year
    type: scientific_treatise
    publication_note: "Prace z lat 1834–1835 ustanowiły podstawy mechaniki Hamiltona."
    publication_note_original: "Papers of 1834–1835 established the foundations of Hamiltonian mechanics."
  - title: "Wykłady o kwaternionach"
