    year: 1884
    precision: year
    type: philosophy
  - title: "Podstawowe prawa arytmetyki"
    original_title: "Grundgesetze der Arithmetik"
    year: 1893
    precision: year
    type: mathematical_treatise
    publication_note: "Pierwszy tom ukazał się w 1893 r., drugi w 1903 r."
    publication_note_original: "The first volume appeared in 1893 and the second in 1903."
ideas:
  - name: "Logika predykatów"
    original_name: "Predicate logic"
    summary: "Frege stworzył pierwszy dojrzały formalny rachunek kwantyfikatorów i relacji, znacznie potężniejszy od tradycyjnej logiki sylogistycznej."
    summary_original: "Frege created the first mature formal calculus of quantification and relations, far more powerful than traditional syllogistic logic."
  - name: "Logicyzm"
    original_name: "Logicism"
    summary: "Próbował wykazać, że prawdy arytmetyczne można wyprowadzić z praw logiki i odpowiednio zdefiniowanych pojęć."
    summary_original: "He sought to show that arithmetic truths could be derived from laws of logic and suitably defined concepts."
  - name: "Sens i znaczenie"
    original_name: "Sense and reference"
    wikipedia: "https://en.wikipedia.org/wiki/Sense_and_reference"
    summary: "Rozróżnienie między sposobem przedstawienia obiektu a samym obiektem stało się fundamentem nowoczesnej filozofii języka."
    summary_original: "The distinction between a mode of presentation and the object itself became foundational in modern philosophy of language."
events:
  - year: 1902
    precision: year
    title: "List Russella o paradoksie"
    original_title: "Russell's letter about the paradox"
    summary: "Bertrand Russell poinformował Fregego o sprzeczności wynikającej z jego systemu zbiorów, tuż przed drukiem drugiego tomu Grundgesetze."
    summary_original: "Bertrand Russell informed Frege of a contradiction arising in his set framework just before the second volume of Grundgesetze went to press."
