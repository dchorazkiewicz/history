image: null
summary: "Niemiecki logik, matematyk i filozof, jeden z twórców nowoczesnej logiki formalnej i filozofii analitycznej. W Begriffsschrift stworzył system logiki predykatów, a jego program logicyzmu próbował wyprowadzić arytmetykę z logiki."
summary_original: "German logician, mathematician and philosopher, one of the creators of modern formal logic and analytic philosophy. In Begriffsschrift he created a predicate-logic system, while his logicist program sought to derive arithmetic from logic."
