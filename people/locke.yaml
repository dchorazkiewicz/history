ideas:
  - name: "Empiricism"
    summary: "Human knowledge begins from experience rather than innate speculative principles."
  - name: "Primary and secondary qualities"
    summary: "Distinguishes qualities attributed to bodies themselves from powers to produce sensations in perceivers."
  - name: "Government by consent"
    summary: "Legitimate political authority depends on consent, with political power limited by rights and purposes."
  - name: "Religious toleration"
    summary: "Argued for broad toleration and against coercion of belief, with historically important qualifications."
