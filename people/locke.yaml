ideas:
  - name: "Empiryzm"
    original_name: "Empiricism"
    summary: "Ludzka wiedza rozpoczyna się od doświadczenia, a nie od wrodzonych zasad spekulatywnych."
    summary_original: "Human knowledge begins from experience rather than innate speculative principles."
  - name: "Jakości pierwotne i wtórne"
    original_name: "Primary and secondary qualities"
    summary: "Rozróżnienie między cechami przypisywanymi samym rzeczom a ich zdolnością do wywoływania określonych wrażeń w obserwatorze."
    summary_original: "Distinguishes qualities attributed to bodies themselves from powers to produce sensations in perceivers."
  - name: "Rządy za zgodą rządzonych"
    original_name: "Government by consent"
    summary: "Prawomocna władza polityczna zależy od zgody, a jej zakres ograniczają prawa jednostek i cele, dla których powstało państwo."
    summary_original: "Legitimate political authority depends on consent, with political power limited by rights and purposes."
  - name: "Tolerancja religijna"
    original_name: "Religious toleration"
    summary: "Locke bronił szerokiej tolerancji religijnej i sprzeciwiał się przymuszaniu ludzi do wiary, choć jego stanowisko miało ważne historyczne ograniczenia."
    summary_original: "Argued for broad toleration and against coercion of belief, with historically important qualifications."
