image: null
summary: "Szwajcarski matematyk i fizyk, jeden z najbardziej wpływowych uczonych w historii matematyki. Przekształcił analizę matematyczną, teorię liczb, mechanikę, hydrodynamikę i astronomię, ujednolicił znaczną część współczesnej notacji oraz pozostawił olbrzymi korpus prac obejmujący niemal wszystkie działy osiemnastowiecznej matematyki."
summary_original: "Swiss mathematician and physicist, one of the most influential scholars in the history of mathematics. He transformed analysis, number theory, mechanics, hydrodynamics and astronomy, standardized much modern notation, and left an enormous body of work spanning almost every area of eighteenth-century mathematics."
