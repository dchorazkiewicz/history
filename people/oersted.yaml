  - name: "Magnetyczne działanie prądu elektrycznego"
    original_name: "Magnetic effect of electric current"
    summary: "Ørsted wykazał, że przepływ prądu w przewodniku wytwarza wokół niego pole oddziałujące na magnes."
    summary_original: "Ørsted showed that current in a conductor creates a surrounding influence acting on a magnet."
  - name: "Jedność sił przyrody"
    original_name: "Unity of natural forces"
    summary: "Jego filozofia przyrody poszukiwała wspólnych zasad dla pozornie różnych sił, co przygotowało kontekst dla odkrycia elektromagnetyzmu."
    summary_original: "His natural philosophy sought common principles behind apparently different forces, providing context for his electromagnetic discovery."
