summary: "Duński fizyk i filozof przyrody. W 1820 r. odkrył, że prąd elektryczny odchyla igłę magnetyczną, ujawniając bezpośredni związek elektryczności i magnetyzmu i zapoczątkowując nowoczesny elektromagnetyzm."
summary_original: "Danish physicist and natural philosopher. In 1820 he discovered that an electric current deflects a magnetic needle, revealing a direct link between electricity and magnetism and launching modern electromagnetism."
