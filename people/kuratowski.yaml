    summary: "Topologię można opisać przez operację domknięcia spełniającą cztery proste aksjomaty."
    summary_original: "A topology can be described by a closure operation satisfying four simple axioms."
  - name: "Twierdzenie Kuratowskiego o grafach planarnych"
    original_name: "Kuratowski's theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Kuratowski%27s_theorem"
    summary: "Graf jest planarny wtedy i tylko wtedy, gdy nie zawiera podziału K5 ani K3,3."
    summary_original: "A graph is planar if and only if it contains no subdivision of K5 or K3,3."
