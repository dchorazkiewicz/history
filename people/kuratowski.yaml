summary: "Polski matematyk, jeden z najważniejszych twórców topologii ogólnej i warszawskiej szkoły matematycznej. Sformułował aksjomaty domknięcia, podał klasyczne kryterium planarności grafów i odegrał dużą rolę w odbudowie polskiej nauki po II wojnie światowej."
summary_original: "Polish mathematician, a major creator of general topology and the Warsaw mathematical school. He formulated closure axioms, gave a classical criterion for graph planarity, and played a major role in rebuilding Polish science after World War II."
