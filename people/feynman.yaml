summary: "Amerykański fizyk teoretyczny, jeden z głównych twórców nowoczesnej elektrodynamiki kwantowej. Wprowadził całki po trajektoriach i diagramy Feynmana, pracował nad nadciekłością, oddziaływaniami słabymi, partonami i wczesnymi ideami obliczeń kwantowych."
summary_original: "American theoretical physicist and a principal creator of modern quantum electrodynamics. He introduced path integrals and Feynman diagrams and worked on superfluidity, weak interactions, partons and early quantum-computation ideas."
