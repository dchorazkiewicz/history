    publication_note_original: "Written with Otto Frisch."
ideas:
  - name: "Fizyczne wyjaśnienie rozszczepienia jądrowego"
    original_name: "Physical explanation of nuclear fission"
    wikipedia: "https://en.wikipedia.org/wiki/Nuclear_fission"
    summary: "Meitner i Frisch wyjaśnili wyniki Hahna i Strassmanna jako podział ciężkiego jądra na dwa lżejsze fragmenty i oszacowali uwalnianą energię z E = mc²."
    summary_original: "Meitner and Frisch interpreted Hahn and Strassmann's results as splitting a heavy nucleus into two lighter fragments and estimated the released energy using E = mc²."
  - name: "Protaktyn"
    original_name: "Protactinium"
    summary: "Meitner i Hahn wyodrębnili długowieczny izotop pierwiastka 91 i ustalili jego miejsce w szeregu promieniotwórczym."
    summary_original: "Meitner and Hahn isolated a long-lived isotope of element 91 and established its place in radioactive decay series."
