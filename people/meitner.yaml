summary: "Austriacko-szwedzka fizyczka, pionierka fizyki jądrowej. Współpracowała przez dekady z Otto Hahnem, współodkryła protaktyn i wraz z Ottonem Frischem podała fizyczną interpretację rozszczepienia jądra atomowego."
summary_original: "Austrian-Swedish physicist and pioneer of nuclear physics. She collaborated for decades with Otto Hahn, co-discovered protactinium, and with Otto Frisch provided the physical interpretation of nuclear fission."
