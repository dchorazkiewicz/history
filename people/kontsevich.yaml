    summary: "Przełom natychmiast umieścił Kontsevicha wśród najważniejszych młodych matematyków świata."
    summary_original: "The breakthrough immediately established Kontsevich among the world's leading young mathematicians."
  - year: 1998
    precision: year
    title: "Medal Fieldsa"
    original_title: "Fields Medal"
    summary: "Otrzymał Medal Fieldsa za prace łączące geometrię, topologię i fizykę matematyczną."
    summary_original: "He received the Fields Medal for work connecting geometry, topology and mathematical physics."
