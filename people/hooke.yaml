summary: "Angielski fizyk, eksperymentator, wynalazca, mikroskopista i architekt. Sformułował prawo sprężystości, rozwijał mikroskopię, obserwował komórkową strukturę korka, badał ruch planet i fale świetlne oraz uczestniczył w odbudowie Londynu po wielkim pożarze."
summary_original: "English physicist, experimentalist, inventor, microscopist and architect. He formulated the law of elasticity, advanced microscopy, observed the cellular structure of cork, studied planetary motion and light waves, and helped rebuild London after the Great Fire."
