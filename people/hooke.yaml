ideas:
  - name: "Prawo Hooke’a"
    original_name: "Hooke's law"
    wikipedia: "https://en.wikipedia.org/wiki/Hooke%27s_law"
    summary: "W zakresie sprężystym odkształcenie jest proporcjonalne do przyłożonej siły."
    summary_original: "Within the elastic regime, deformation is proportional to applied force."
  - name: "Komórka biologiczna"
    original_name: "Biological cell"
    summary: "Opisując strukturę korka w Micrographii Hooke wprowadził termin „cell” dla widocznych pod mikroskopem komór."
    summary_original: "While describing cork in Micrographia, Hooke introduced the term 'cell' for the compartments seen under the microscope."
  - name: "Falowe idee o świetle"
    original_name: "Wave ideas of light"
    summary: "Hooke opisywał światło jako szybkie drgania rozchodzące się w ośrodku, rozwijając jedną z wczesnych teorii falowych."
    summary_original: "Hooke described light as rapid vibrations propagating through a medium, contributing to early wave theories."
  - name: "Prawo odwrotności kwadratu w grawitacji"
    original_name: "Inverse-square ideas in gravitation"
    summary: "Hooke rozważał przyciąganie malejące z kwadratem odległości i jego związek z ruchem planet, choć nie podał pełnej teorii orbitalnej Newtona."
    summary_original: "Hooke considered attraction decreasing with the square of distance and its relation to planetary motion, though he did not provide Newton's complete orbital theory."
