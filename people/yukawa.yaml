summary: "Japoński fizyk teoretyczny, który zaproponował istnienie mezonu jako nośnika krótkiego zasięgu siły jądrowej. Jego teoria była jednym z pierwszych wielkich sukcesów kwantowej teorii pola w fizyce jądrowej."
summary_original: "Japanese theoretical physicist who proposed a meson as the carrier of the short-range nuclear force. His theory was among the first major successes of quantum field theory in nuclear physics."
