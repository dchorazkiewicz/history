ideas:
  - name: "Twierdzenie Pascala"
    original_name: "Pascal's theorem"
    wikipedia: "https://en.wikipedia.org/wiki/Pascal%27s_theorem"
    summary: "Dla sześciokąta wpisanego w stożkową punkty przecięcia par przeciwległych boków leżą na jednej prostej; rezultat stał się jednym z fundamentów geometrii rzutowej."
    summary_original: "For a hexagon inscribed in a conic, the intersections of pairs of opposite sides lie on a single line; the result became a foundation of projective geometry."
  - name: "Rachunek prawdopodobieństwa z Fermatem"
    original_name: "Probability theory with Fermat"
    summary: "Korespondencja Pascala z Fermatem w 1654 r. nad problemem podziału stawki ukształtowała podstawowe idee klasycznego rachunku prawdopodobieństwa."
    summary_original: "Pascal's 1654 correspondence with Fermat on the problem of points shaped foundational ideas of classical probability theory."
  - name: "Prawo Pascala"
    original_name: "Pascal's law"
    wikipedia: "https://en.wikipedia.org/wiki/Pascal%27s_law"
    summary: "Zmiana ciśnienia przyłożona do zamkniętej cieczy przenosi się w całej cieczy, co stało się podstawą hydrauliki."
    summary_original: "A pressure change applied to a confined fluid is transmitted throughout the fluid, becoming a foundation of hydraulics."
  - name: "Próżnia i ciśnienie atmosferyczne"
    original_name: "Vacuum and atmospheric pressure"
    summary: "Eksperymenty Pascala wspierały istnienie próżni i interpretację wysokości słupa rtęci jako skutku ciśnienia atmosferycznego."
    summary_original: "Pascal's experiments supported the existence of a vacuum and interpreted mercury-column height as an effect of atmospheric pressure."
  - name: "Zakład Pascala"
    original_name: "Pascal's wager"
    wikipedia: "https://en.wikipedia.org/wiki/Pascal%27s_wager"
    summary: "W Myślach Pascal sformułował argument decyzyjny dotyczący wiary, łączący religię z rozumowaniem o ryzyku, możliwych zyskach i stratach."
    summary_original: "In the Pensées Pascal formulated a decision-theoretic argument about belief, connecting religion with reasoning about risk, possible gains and losses."
events:
  - year: 1642
    precision: year
    title: "Budowa Pascaliny"
    original_title: "Construction of the Pascaline"
    summary: "Pascal rozpoczął budowę mechanicznego kalkulatora mającego ułatwić ojcu pracę przy obliczeniach podatkowych."
    summary_original: "Pascal began building a mechanical calculator to assist his father's tax calculations."
  - year: 1648
    precision: year
    title: "Eksperyment na Puy de Dôme"
    original_title: "Puy de Dôme experiment"
    summary: "Florin Périer, działając według planu Pascala, wykazał zmianę wysokości słupa rtęci wraz z wysokością, wspierając teorię ciśnienia atmosferycznego."
    summary_original: "Florin Périer, following Pascal's plan, demonstrated changes in mercury-column height with altitude, supporting atmospheric-pressure theory."
  - year: 1654
    precision: year
    title: "Korespondencja z Fermatem o prawdopodobieństwie"
    original_title: "Correspondence with Fermat on probability"
    summary: "Rozważania nad problemami hazardowymi doprowadziły do podstaw klasycznego rachunku prawdopodobieństwa."
    summary_original: "Discussion of gambling problems led to foundations of classical probability theory."
