summary: "Francuski matematyk, fizyk, konstruktor, filozof i pisarz religijny. W młodości wniósł ważny wkład do geometrii rzutowej i skonstruował maszynę liczącą; później wraz z Fermatem tworzył podstawy rachunku prawdopodobieństwa, badał próżnię i ciśnienie, a w Prowincjałkach i Myślach zapisał się również w historii literatury i filozofii."
summary_original: "French mathematician, physicist, inventor, philosopher and religious writer. As a youth he made major contributions to projective geometry and built a calculating machine; later with Fermat he helped found probability theory, investigated vacuum and pressure, and through the Provincial Letters and Pensées also entered literary and philosophical history."
