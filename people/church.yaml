summary: "Amerykański matematyk i logik, twórca rachunku lambda i jeden z ojców teorii obliczalności. Niezależnie od Turinga wykazał nierozstrzygalność ogólnego problemu decyzyjnego i współtworzył pojęcie funkcji efektywnie obliczalnej."
summary_original: "American mathematician and logician, creator of lambda calculus and one of the fathers of computability theory. Independently of Turing he established the undecidability of the general decision problem and helped shape the concept of effective computability."
