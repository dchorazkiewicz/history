    wikipedia: "https://en.wikipedia.org/wiki/Lambda_calculus"
    summary: "Formalizm opisujący funkcje, podstawianie i obliczenia stał się jednym z głównych modeli obliczalności i podstawą języków funkcyjnych."
    summary_original: "A formalism for functions, substitution and computation became a major model of computability and a foundation of functional programming."
  - name: "Twierdzenie Churcha"
    original_name: "Church's theorem"
    summary: "Church wykazał, że ogólny Entscheidungsproblem logiki pierwszego rzędu jest nierozstrzygalny."
    summary_original: "Church proved that the general Entscheidungsproblem for first-order logic is undecidable."
  - name: "Teza Churcha-Turinga"
    original_name: "Church–Turing thesis"
    wikipedia: "https://en.wikipedia.org/wiki/Church%E2%80%93Turing_thesis"
    summary: "Różne formalizmy obliczalności Churcha i Turinga okazały się równoważne i doprowadziły do tezy, że opisują intuicyjne pojęcie efektywnego algorytmu."
    summary_original: "Church's and Turing's different formalisms proved equivalent, leading to the thesis that they capture the intuitive notion of effective algorithm."
