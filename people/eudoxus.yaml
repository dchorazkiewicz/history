    url: "https://mathshistory.st-andrews.ac.uk/Biographies/Eudoxus/"
  - title: "Encyclopaedia Britannica 1911 — Eudoxus of Cnidus"
    url: "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eudoxus_of_Cnidus"
  - title: "Wikisource — Eudoxus of Cnidus"
    url: "https://en.wikisource.org/wiki/Author:Eudoxus"
