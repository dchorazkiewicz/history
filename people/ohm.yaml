    summary: "Dla elementu omowego napięcie jest proporcjonalne do natężenia prądu, a współczynnikiem proporcjonalności jest opór."
    summary_original: "For an ohmic element voltage is proportional to current, with resistance as the proportionality constant."
  - name: "Opór elektryczny jako wielkość fizyczna"
    original_name: "Electrical resistance as a physical quantity"
    summary: "Ohm systematycznie opisywał wpływ materiału, długości i przekroju przewodnika na przepływ prądu."
    summary_original: "Ohm systematically described how material, length and cross-section affect electric current."
