summary: "Niemiecki fizyk znany z ilościowego prawa łączącego napięcie, natężenie i opór elektryczny. Jego podejście matematyczne pomogło przekształcić badania elektryczne z jakościowych obserwacji w precyzyjną fizykę pomiarową."
summary_original: "German physicist known for the quantitative law linking voltage, current and resistance. His mathematical approach helped transform electrical research from qualitative observation into precise measurement science."
