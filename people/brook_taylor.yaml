image: null
summary: "Angielski matematyk związany z Royal Society. Rozwijał rachunek różnic skończonych, całkowanie przez części i rozwinięcia funkcji w szeregi, a równolegle pisał o perspektywie, malarstwie i muzyce."
summary_original: "English mathematician associated with the Royal Society. He developed finite-difference calculus, integration by parts and function expansions into series, while also writing on perspective, painting and music."
