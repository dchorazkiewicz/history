    summary: "Skala temperatury została zdefiniowana tak, aby opierać się na zasadach termodynamiki i posiadać naturalne zero absolutne."
    summary_original: "The temperature scale was defined from thermodynamic principles with a natural absolute zero."
  - name: "Sformułowanie drugiej zasady termodynamiki"
    original_name: "Kelvin statement of the second law"
    summary: "Kelvin sformułował niemożliwość cyklicznego przekształcania całego ciepła pobranego z jednego źródła w pracę."
    summary_original: "Kelvin formulated the impossibility of converting all heat taken from a single reservoir into work in a cyclic process."
  - name: "Technika kabla transatlantyckiego"
    original_name: "Transatlantic telegraph engineering"
    summary: "Analizował rozchodzenie sygnałów w długich kablach i projektował czułe przyrządy pomiarowe potrzebne do praktycznej telegrafii oceanicznej."
    summary_original: "He analyzed signal propagation in long cables and designed sensitive instruments needed for practical oceanic telegraphy."
