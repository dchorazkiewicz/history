summary: "Brytyjski fizyk, matematyk i inżynier. Współtworzył termodynamikę, wprowadził bezwzględną skalę temperatury, pracował nad elektromagnetyzmem i transportem ciepła oraz odegrał kluczową rolę techniczną w rozwoju transatlantyckiego telegrafu."
summary_original: "British physicist, mathematician and engineer. He helped build thermodynamics, introduced the absolute temperature scale, worked on electromagnetism and heat transport, and played a key technical role in the transatlantic telegraph."
