    year: 1906
    precision: year
    type: mathematical_treatise
ideas:
  - name: "Przestrzeń metryczna"
    original_name: "Metric space"
    wikipedia: "https://en.wikipedia.org/wiki/Metric_space"
    summary: "Fréchet abstrahował pojęcie odległości od zwykłej przestrzeni geometrycznej i zastosował je do zbiorów funkcji i innych obiektów."
    summary_original: "Fréchet abstracted the notion of distance from ordinary geometry and applied it to spaces of functions and other objects."
  - name: "Rachunek funkcjonalny"
    original_name: "Functional analysis"
    summary: "Badał funkcje, których argumentami są same funkcje lub bardziej ogólne obiekty, pomagając tworzyć język analizy nieskończeniewymiarowej."
    summary_original: "He studied functions whose arguments are themselves functions or more general objects, helping create the language of infinite-dimensional analysis."
