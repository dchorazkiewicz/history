summary: "Francuski matematyk, jeden z pionierów analizy funkcjonalnej i topologii ogólnej. W swojej rozprawie doktorskiej wprowadził pojęcie przestrzeni metrycznej, dając wspólny język dla wielu wcześniej odrębnych problemów."
summary_original: "French mathematician and a pioneer of functional analysis and general topology. In his doctoral thesis he introduced the concept of a metric space, providing a common language for many previously separate problems."
