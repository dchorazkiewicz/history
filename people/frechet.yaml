    original_title: "Doctorate and introduction of metric spaces"
    summary: "Rozprawa Frécheta stała się jednym z dokumentów założycielskich nowoczesnej topologii ogólnej."
    summary_original: "Fréchet's thesis became one of the founding documents of modern general topology."
