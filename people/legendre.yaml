fields: [mathematics, number_theory, analysis, elliptic_functions, statistics, astronomy, geometry, geodesy]
image: null
summary: "Francuski matematyk o ogromnym wpływie na teorię liczb, funkcje eliptyczne, geometrię i metody obliczeniowe astronomii. Jako pierwszy opublikował metodę najmniejszych kwadratów, wprowadził symbol Legendre’a i systematycznie badał całki eliptyczne."
summary_original: "French mathematician with major influence on number theory, elliptic functions, geometry and astronomical computation. He was the first to publish the method of least squares, introduced the Legendre symbol and systematically studied elliptic integrals."
