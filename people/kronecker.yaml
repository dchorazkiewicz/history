summary: "Niemiecki matematyk zajmujący się teorią liczb, algebrą i podstawami matematyki. Był wpływowym zwolennikiem podejścia konstruktywnego i sceptycznie odnosił się do swobodnego użycia aktualnej nieskończoności."
summary_original: "German mathematician working in number theory, algebra and foundations. He was an influential advocate of constructive approaches and skeptical of unrestricted use of actual infinity."
