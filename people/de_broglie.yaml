summary: "Francuski fizyk teoretyczny, który zaproponował falową naturę materii. Jego hipoteza, że cząstkom materialnym odpowiada długość fali związana z pędem, stała się jednym z fundamentów mechaniki falowej."
summary_original: "French theoretical physicist who proposed the wave nature of matter. His hypothesis that material particles possess a wavelength related to momentum became foundational to wave mechanics."
