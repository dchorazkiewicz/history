    wikipedia: "https://en.wikipedia.org/wiki/Matter_wave"
    summary: "De Broglie zaproponował relację λ = h/p, przypisując długość fali cząstce o pędzie p."
    summary_original: "De Broglie proposed the relation lambda = h/p, assigning a wavelength to a particle of momentum p."
  - name: "Dualizm korpuskularno-falowy materii"
    original_name: "Wave-particle duality of matter"
    summary: "Rozszerzył dualizm znany dla światła na elektrony i inne cząstki materialne."
    summary_original: "He extended the wave-particle duality known for light to electrons and other matter particles."
