ideas:
  - name: "Liczba Macha"
    original_name: "Mach number"
    wikipedia: "https://en.wikipedia.org/wiki/Mach_number"
    summary: "Stosunek prędkości obiektu do lokalnej prędkości dźwięku stał się podstawową miarą przepływów naddźwiękowych."
    summary_original: "The ratio of an object's speed to the local speed of sound became a basic measure in supersonic flow."
  - name: "Fale uderzeniowe"
    original_name: "Shock waves"
    summary: "Mach fotografował i analizował fale uderzeniowe powstające przy ruchu pocisków z prędkościami naddźwiękowymi."
    summary_original: "Mach photographed and analyzed shock waves produced by projectiles moving at supersonic speeds."
  - name: "Zasada Macha"
    original_name: "Mach's principle"
    wikipedia: "https://en.wikipedia.org/wiki/Mach%27s_principle"
    summary: "Mach krytykował absolutną przestrzeń Newtona i sugerował, że bezwładność powinna być rozumiana w relacji do rozkładu materii we Wszechświecie."
    summary_original: "Mach criticized Newtonian absolute space and suggested that inertia should be understood relative to the distribution of matter in the universe."
  - name: "Empiriokrytycyzm"
    original_name: "Empirio-criticism"
    summary: "Mach uważał pojęcia naukowe za ekonomiczne organizacje doświadczenia i był sceptyczny wobec bytów nieweryfikowalnych bezpośrednio."
    summary_original: "Mach viewed scientific concepts as economical organizations of experience and was skeptical of entities not directly verifiable."
events:
  - year: 1887
    precision: year
    title: "Fotografie fal uderzeniowych"
    original_title: "Photography of shock waves"
    summary: "Mach i jego współpracownicy uzyskali obrazy fal powstających przy naddźwiękowym locie pocisków."
    summary_original: "Mach and collaborators obtained images of shock waves generated by supersonic projectiles."
