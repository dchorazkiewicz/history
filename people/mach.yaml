image: null
summary: "Austriacki fizyk i filozof nauki. Badał fale uderzeniowe i ruch naddźwiękowy, fizjologię percepcji i podstawy mechaniki, a jego radykalny empiryzm wywarł silny wpływ na debatę o atomach i na młodego Einsteina."
summary_original: "Austrian physicist and philosopher of science. He studied shock waves and supersonic motion, sensory physiology and foundations of mechanics, while his radical empiricism strongly influenced debates about atoms and the young Einstein."
