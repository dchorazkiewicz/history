summary: "Polski matematyk, jeden z głównych twórców warszawskiej szkoły teorii mnogości i topologii. Pracował nad teorią zbiorów, continuum, teorią liczb i topologią, a jego nazwisko noszą m.in. trójkąt i dywan Sierpińskiego."
summary_original: "Polish mathematician and one of the principal creators of the Warsaw school of set theory and topology. He worked on set theory, the continuum, number theory and topology, and his name is attached to the Sierpiński triangle and carpet."
