summary: "Francusko-angielski matematyk, hugenocki uchodźca mieszkający w Londynie. Był jednym z głównych twórców XVIII-wiecznej teorii prawdopodobieństwa, badał liczby zespolone, rozkład normalny, tablice śmiertelności i matematykę rent życiowych."
summary_original: "French-born English mathematician and Huguenot refugee living in London. He was a major developer of eighteenth-century probability, and worked on complex numbers, the normal distribution, mortality tables and the mathematics of life annuities."
