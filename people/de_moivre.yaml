    title: "Ucieczka z Francji po odwołaniu edyktu nantejskiego"
    original_title: "Flight from France after the revocation of the Edict of Nantes"
    summary: "Jako protestant de Moivre wyemigrował do Anglii i pozostał w Londynie do końca życia."
    summary_original: "As a Protestant, de Moivre emigrated to England and remained in London for the rest of his life."
  - year: 1697
    precision: year
    title: "Wybór do Royal Society"
    original_title: "Election to the Royal Society"
    summary: "Zyskał uznanie angielskiego środowiska naukowego, choć nigdy nie otrzymał stałej katedry uniwersyteckiej."
    summary_original: "He gained recognition in English scientific circles, although he never obtained a permanent university chair."
