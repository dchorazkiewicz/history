ideas:
  - name: "Wzór de Moivre’a"
    original_name: "De Moivre's formula"
    wikipedia: "https://en.wikipedia.org/wiki/De_Moivre%27s_formula"
    summary: "Wzór łączy potęgi liczb zespolonych z funkcjami trygonometrycznymi i stał się podstawowym narzędziem analizy zespolonej."
    summary_original: "The formula connects powers of complex numbers with trigonometric functions and became a basic tool of complex analysis."
  - name: "Rozkład normalny jako przybliżenie dwumianowego"
    original_name: "Normal approximation to the binomial distribution"
    summary: "W 1733 r. de Moivre podał pierwszą postać normalnego przybliżenia rozkładu dwumianowego, poprzedzając późniejszą teorię Gaussa i Laplace’a."
    summary_original: "In 1733 de Moivre gave the first form of the normal approximation to the binomial distribution, preceding later work by Gauss and Laplace."
  - name: "Matematyka rent i śmiertelności"
    original_name: "Mathematics of annuities and mortality"
    summary: "Łączył tablice długości życia z rachunkiem procentowym, tworząc ważne podstawy matematyki ubezpieczeniowej."
    summary_original: "He combined mortality tables with interest calculations, contributing important foundations to actuarial mathematics."
