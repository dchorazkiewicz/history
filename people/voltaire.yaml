ideas:
  - name: "Newtonizm we Francji"
    original_name: "Newtonianism in France"
    summary: "Voltaire przedstawiał fizykę i filozofię przyrody Newtona szerokiej francuskojęzycznej publiczności oraz polemizował z dominującymi modelami kartezjańskimi."
    summary_original: "Presented Newton's physics and natural philosophy to a broad French-reading public and argued against dominant Cartesian models."
  - name: "Tolerancja religijna"
    original_name: "Religious toleration"
    summary: "Krytykował prześladowania religijne i bronił tolerancji obywatelskiej, m.in. w Traktacie o tolerancji."
    summary_original: "Critiqued persecution and defended civil toleration in major interventions such as the Traité sur la tolérance."
  - name: "Krytyka dogmatyzmu"
    original_name: "Critique of dogmatism"
    summary: "Wykorzystywał historię, satyrę, polemikę i powiastkę filozoficzną do podważania dogmatyzmu metafizycznego, kościelnego i politycznego."
    summary_original: "Used history, satire, polemic and philosophical tales to challenge metaphysical, ecclesiastical and political dogmatism."
events:
  - year: 1726
    title: "Pobyt na wygnaniu w Anglii"
    original_title: "Exile in England"
    summary: "W latach około 1726–1729 przebywał w Anglii, gdzie zetknął się z angielskimi instytucjami politycznymi oraz myślą Locke'a i Newtona."
    summary_original: "Spent roughly 1726–1729 in England, where he encountered English political institutions and the thought of Locke and Newton."
  - year: 1738
    title: "Publikacja Elementów filozofii Newtona"
    original_title: "Publication of Éléments de la philosophie de Newton"
    summary: "Jedno z najważniejszych dzieł popularyzujących naukę Newtona i newtonizm we Francji."
    summary_original: "A major work of scientific exposition associated with Voltaire's campaign for Newtonian ideas in France."
