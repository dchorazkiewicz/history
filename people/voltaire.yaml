ideas:
  - name: "Newtonianism in France"
    summary: "Presented Newton's physics and natural philosophy to a broad French-reading public and argued against dominant Cartesian models."
  - name: "Religious toleration"
    summary: "Critiqued persecution and defended civil toleration in major interventions such as the Traité sur la tolérance."
  - name: "Critique of dogmatism"
    summary: "Used history, satire, polemic and philosophical tales to challenge metaphysical, ecclesiastical and political dogmatism."
