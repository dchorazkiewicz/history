ideas:
  - name: "Równania Maxwella"
    original_name: "Maxwell's equations"
    wikipedia: "https://en.wikipedia.org/wiki/Maxwell%27s_equations"
    summary: "Układ równań opisuje pola elektryczne i magnetyczne, ich źródła oraz wzajemne sprzężenie w czasie."
    summary_original: "The equations describe electric and magnetic fields, their sources and their time-dependent coupling."
  - name: "Światło jako fala elektromagnetyczna"
    original_name: "Light as an electromagnetic wave"
    summary: "Maxwell zauważył, że prędkość fal wynikających z teorii elektromagnetyzmu jest zgodna z prędkością światła, co doprowadziło do identyfikacji światła jako fali elektromagnetycznej."
    summary_original: "Maxwell noticed that the speed of waves predicted by electromagnetic theory matched the speed of light, leading to the identification of light as an electromagnetic wave."
  - name: "Rozkład Maxwella prędkości cząsteczek"
    original_name: "Maxwell distribution"
    wikipedia: "https://en.wikipedia.org/wiki/Maxwell%E2%80%93Boltzmann_distribution"
    summary: "Maxwell wprowadził statystyczny opis rozkładu prędkości cząsteczek gazu."
    summary_original: "Maxwell introduced a statistical description of the distribution of molecular speeds in a gas."
  - name: "Pierwsza trwała fotografia barwna"
    original_name: "Early color photography"
    summary: "W 1861 r. zademonstrował metodę addytywnego składania trzech barw, ilustrując trójchromatyczną teorię widzenia."
    summary_original: "In 1861 he demonstrated additive color combination from three primaries, illustrating trichromatic color theory."
events:
  - year: 1861
    precision: year
    title: "Demonstracja fotografii barwnej"
    original_title: "Color photography demonstration"
    summary: "Maxwell zaprezentował obraz uzyskany przez projekcję trzech składowych barwnych."
    summary_original: "Maxwell demonstrated an image formed by projecting three color components."
  - year: 1871
    precision: year
    title: "Pierwszy profesor fizyki eksperymentalnej w Cambridge"
    original_title: "First Cavendish Professor of Experimental Physics"
    summary: "Maxwell objął nową katedrę i nadzorował powstanie Cavendish Laboratory."
    summary_original: "Maxwell took the new chair and supervised the creation of the Cavendish Laboratory."
