image: null
summary: "Szkocki fizyk i matematyk, twórca klasycznej teorii elektromagnetyzmu. Zunifikował elektryczność, magnetyzm i światło w jednym układzie równań, rozwijał kinetyczną teorię gazów i statystykę cząsteczek oraz prowadził pionierskie badania nad widzeniem barw."
summary_original: "Scottish physicist and mathematician, creator of classical electromagnetic theory. He unified electricity, magnetism and light in a single system of equations, advanced kinetic gas theory and molecular statistics, and conducted pioneering studies of color vision."
