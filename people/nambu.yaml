    year: 1961
    precision: year
    type: scientific_treatise
    publication_note: "Praca z Giovannim Joną-Lasinio."
    publication_note_original: "Work with Giovanni Jona-Lasinio."
ideas:
  - name: "Spontaniczne łamanie symetrii"
    original_name: "Spontaneous symmetry breaking"
    wikipedia: "https://en.wikipedia.org/wiki/Spontaneous_symmetry_breaking"
    summary: "Równania teorii mogą zachowywać symetrię, podczas gdy jej najniższy stan energetyczny już jej nie posiada."
    summary_original: "A theory's equations can possess a symmetry while its lowest-energy state does not."
  - name: "Model Nambu-Jona-Lasinio"
    original_name: "Nambu–Jona-Lasinio model"
    summary: "Model pokazał, jak mechanizm podobny do nadprzewodnictwa może dynamicznie generować masy i łamać symetrię."
    summary_original: "The model showed how a superconductivity-like mechanism can dynamically generate masses and break symmetry."
  - name: "Kolor w teorii kwarków"
    original_name: "Color degree of freedom"
    summary: "Nambu należał do pierwszych fizyków wykorzystujących dodatkowy stopień swobody odpowiadający późniejszemu kolorowi kwarków."
    summary_original: "Nambu was among the first physicists to use an additional degree of freedom corresponding to what became quark color."
