image: null
summary: "Japońsko-amerykański fizyk teoretyczny, pionier pojęcia spontanicznego łamania symetrii w fizyce cząstek. Jego idee stały się fundamentalne dla Modelu Standardowego i wpłynęły na rozwój wczesnej teorii strun."
summary_original: "Japanese-American theoretical physicist and pioneer of spontaneous symmetry breaking in particle physics. His ideas became fundamental to the Standard Model and influenced early string theory."
works:
  - title: "Dynamiczny model cząstek elementarnych oparty na analogii z nadprzewodnictwem I"
