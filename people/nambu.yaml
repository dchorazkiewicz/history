    summary: "Nambu otrzymał połowę nagrody za odkrycie mechanizmu spontanicznego łamania symetrii w fizyce subatomowej."
    summary_original: "Nambu received half the prize for discovering the mechanism of spontaneous broken symmetry in subatomic physics."
