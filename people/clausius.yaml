image: null
summary: "Niemiecki fizyk, jeden z głównych twórców termodynamiki. Sformułował nowoczesną postać drugiej zasady, wprowadził pojęcie entropii i rozwijał kinetyczną teorię gazów."
summary_original: "German physicist and one of the principal founders of thermodynamics. He formulated the modern second law, introduced entropy and advanced the kinetic theory of gases."
works:
  - title: "O sile poruszającej ciepła i prawach, które można z niej wyprowadzić"
