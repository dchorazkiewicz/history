ideas:
  - name: "Zasada zachowania energii"
    original_name: "Conservation of energy"
    summary: "Helmholtz argumentował, że w procesach fizycznych energia zmienia formę, lecz nie jest tworzona ani niszczona."
    summary_original: "Helmholtz argued that in physical processes energy changes form but is neither created nor destroyed."
  - name: "Oftalmoskop"
    original_name: "Ophthalmoscope"
    wikipedia: "https://en.wikipedia.org/wiki/Ophthalmoscopy"
    summary: "Przyrząd umożliwił lekarzom bezpośrednie oglądanie wnętrza żywego oka."
    summary_original: "The instrument allowed physicians to inspect the interior of the living eye directly."
  - name: "Teoria rezonansu słuchowego"
    original_name: "Resonance theory of hearing"
    summary: "Helmholtz analizował barwę dźwięku przez harmoniczne składowe i rezonans układu słuchowego."
    summary_original: "Helmholtz analyzed timbre through harmonic components and resonance in the auditory system."
