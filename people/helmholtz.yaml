summary: "Niemiecki lekarz, fizjolog i fizyk. Sformułował zasadę zachowania energii w szerokiej postaci, badał fizjologię wzroku i słuchu, skonstruował oftalmoskop oraz rozwijał elektrodynamikę i teorię wirów."
summary_original: "German physician, physiologist and physicist. He formulated a broad principle of energy conservation, studied vision and hearing, invented the ophthalmoscope, and advanced electrodynamics and vortex theory."
