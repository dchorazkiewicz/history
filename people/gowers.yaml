image: null
summary: "Brytyjski matematyk, który połączył analizę funkcjonalną z kombinatoryką i rozwiązał szereg długo otwartych problemów o przestrzeniach Banacha. Później wniósł ważny wkład do kombinatoryki addytywnej i zainicjował projekty Polymath — otwartą współpracę matematyczną online."
summary_original: "British mathematician who combined functional analysis with combinatorics and solved several long-standing problems on Banach spaces. He later made major contributions to additive combinatorics and initiated the Polymath projects for open online mathematical collaboration."
works:
  - title: "Nowy dowód twierdzenia Szemerédiego"
