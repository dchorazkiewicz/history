  - title: "Princeton Companion to Mathematics"
    original_title: "The Princeton Companion to Mathematics"
    year: 2008
    precision: year
    type: reference_work
    publication_note: "Gowers był redaktorem głównym wielkiego kompendium współczesnej matematyki."
    publication_note_original: "Gowers served as editor of the major compendium of modern mathematics."
ideas:
  - name: "Dychotomia Gowersa"
    original_name: "Gowers dichotomy"
    summary: "Gowers odkrył głęboką alternatywę strukturalną dla nieskończeniewymiarowych przestrzeni Banacha, wykorzystując idee teorii Ramseya."
    summary_original: "Gowers discovered a deep structural dichotomy for infinite-dimensional Banach spaces using Ramsey-theoretic ideas."
  - name: "Normy Gowersa"
    original_name: "Gowers uniformity norms"
    wikipedia: "https://en.wikipedia.org/wiki/Gowers_norm"
    summary: "Normy mierzą wyższy stopień pseudolosowości funkcji i stały się podstawowym narzędziem kombinatoryki addytywnej."
    summary_original: "The norms measure higher-order pseudorandomness and became basic tools in additive combinatorics."
  - name: "Polymath"
    original_name: "Polymath Project"
    wikipedia: "https://en.wikipedia.org/wiki/Polymath_Project"
    summary: "Gowers zaproponował prowadzenie otwartej współpracy matematycznej na blogach i wiki, co doprowadziło do rzeczywistych wspólnych dowodów."
    summary_original: "Gowers proposed open mathematical collaboration through blogs and wikis, leading to genuine collective proofs."
