schema_version: 1

# Centralny rejestr osób w projekcie.
# Ten plik służy do szybkiego sprawdzania:
# - kogo już mamy,
# - kto został opisany,
# - kto dopiero czeka na opracowanie.
#
# Statusy:
#   pending     - osoba zgłoszona, ale jeszcze nieopracowana
#   researching - trwa zbieranie i weryfikacja danych
#   described   - podstawowy rekord osoby został opracowany w people/<id>.yaml
#   reviewed    - rekord został dodatkowo sprawdzony / rozszerzony
#
# Przy dodawaniu nowych osób z dużej listy najpierw dopisujemy je tutaj
# ze statusem pending. Po stworzeniu pliku w people/ zmieniamy status.

people:
